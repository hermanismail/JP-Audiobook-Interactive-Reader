<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b0b0d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Roboto, Arial, sans-serif' font-weight='700' font-size='20' fill='%23e08a3c'%3ES%3C/text%3E%3C/svg%3E">
<title>SHAMA Library</title>
<!--
  LAYER 2 of the app-shell rebuild (see CLAUDE.md's layer map). Pure book
  browsing - no server-side selection happens here, this page only reads
  which book is currently active (to highlight/sort it) and otherwise has
  no side effects. Connects to the shared WebSocket as role:'controller'
  (never 'player'), so simply opening this page never qualifies this
  browser/device as an available playback target.

  The mode flag (?mode=player|remote) arrives via the URL, carried from
  wherever this page was reached from (index.html's Player pill, or
  remote.html's own Library icon) - this page holds no flag of its own
  beyond what's in the query string, and passes it straight through to
  chapter.html on a book click.
-->
<style>
  :root {
    --bg:#0b0b0d; --ink:#e8e6ea; --panel-bg-2:#1c1a20;
    --border:#3a3840; --muted2:#9a97a0; --placeholder-ink:#4a4650;
    --accent:#e08a3c; --book-pill-ink:#d6d6d6;
  }
  :root.light {
    --bg:#e5decf; --ink:#000000; --panel-bg-2:#efe8d8;
    --border:#b8ab8e; --muted2:#8a7f68; --placeholder-ink:#a89a7d;
    --accent:#e08a3c; --book-pill-ink:#000000;
  }
  html, body {
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:"Roboto","Arial",sans-serif;
  }
  body { box-sizing:border-box; padding:24px 16px; display:flex; flex-direction:column; align-items:center; }

  #topBar { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:24px; }
  #homeBtn {
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width:50px; height:50px; border-radius:50%; padding:0; cursor:pointer;
    border:1px solid var(--border); color:var(--ink); text-decoration:none;
  }

  /* Same visual language as index.html's .modePill, but purely
     informational - never orange/accent, never clickable, just tells the
     user which mode this browsing session is in. */
  #modeIndicator {
    display:flex; align-items:center; justify-content:center; gap:8px;
    height:40px; padding:0 20px; box-sizing:border-box; border-radius:999px;
    border:1px solid var(--border); color:var(--ink); font-size:14px; font-weight:600;
    text-transform:uppercase;
  }
  #modeIndicator svg { flex-shrink:0; width:1em; height:1em; }

  #homeGrid {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    align-content:flex-start; gap:50px; padding:12px 16px; box-sizing:border-box;
    width:100%; max-width:1300px;
  }
  .bookPill {
    width:400px; height:400px; box-sizing:border-box;
    border:2px solid var(--muted2); border-radius:28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:16px; cursor:pointer;
  }
  .bookPill.current { border-color:var(--accent); }
  .bookCover, .bookCoverPlaceholder {
    width:300px; height:300px; border-radius:12px; object-fit:cover;
    background:var(--panel-bg-2); flex-shrink:0;
  }
  .bookCoverPlaceholder { display:flex; align-items:center; justify-content:center; color:var(--placeholder-ink); font-size:48px; }
  /* Same rectangular feather mask as index.html's #zenImage/.bookCover rule
     (that page's canonical definition) - no #zenImage exists here since
     this page never renders the reveal engine, so scoped to just these
     two classes. */
  .bookCover, .bookCoverPlaceholder {
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-composite: source-in;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    mask-composite: intersect;
    mask-repeat: no-repeat;
    mask-size: 100% 100%;
  }
  .bookTitle, .bookAuthor {
    font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif;
    color:var(--book-pill-ink); text-align:center; width:100%; flex-shrink:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .bookTitle { font-size:18px; font-weight:700; line-height:1.3; }
  .bookAuthor { font-size:16px; line-height:1.3; }
  #emptyMsg { color:var(--muted2); font-size:14px; }
</style>
</head>
<body>

<div id="topBar">
  <a id="homeBtn" href="index.html" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </a>
  <div id="modeIndicator">
    <svg id="modeIndicatorIconPlayer" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <svg id="modeIndicatorIconRemote" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><rect x="7" y="2" width="10" height="20" rx="4"/><circle cx="12" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>
    <span id="modeIndicatorLabel">Player</span>
  </div>
</div>

<div id="homeGrid"></div>

<script>
(function(){
  var homeGrid = document.getElementById('homeGrid');
  var modeIndicatorLabel = document.getElementById('modeIndicatorLabel');
  var iconPlayer = document.getElementById('modeIndicatorIconPlayer');
  var iconRemote = document.getElementById('modeIndicatorIconRemote');

  var theme = 'dark';
  try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  document.documentElement.classList.toggle('light', theme === 'light');

  var mode = (new URLSearchParams(location.search).get('mode') === 'remote') ? 'remote' : 'player';
  modeIndicatorLabel.textContent = mode === 'remote' ? 'Remote' : 'Player';
  iconPlayer.style.display = mode === 'remote' ? 'none' : '';
  iconRemote.style.display = mode === 'remote' ? '' : 'none';

  // --- WebSocket: controller-only. Never sends `hello` with role:'player',
  // so simply browsing here never qualifies this device as a playback
  // target. Only listens for the active device's `state` (to know which
  // book to highlight/sort first) - no commands are ever sent from here.
  var activeBookId = null;
  var ws = null;

  function connect(){
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    ws.addEventListener('open', function(){
      var deviceId;
      try {
        deviceId = sessionStorage.getItem('libraryControllerId');
        if (!deviceId) { deviceId = crypto.randomUUID(); sessionStorage.setItem('libraryControllerId', deviceId); }
      } catch (e) { deviceId = 'lib-' + Math.random().toString(36).slice(2); }
      ws.send(JSON.stringify({ type: 'hello', role: 'controller', deviceId: deviceId, deviceName: 'Library', deviceKind: 'controller' }));
    });
    ws.addEventListener('message', function(ev){
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'state' && msg.bookId) {
        activeBookId = msg.bookId;
        highlightCurrent();
      }
    });
    ws.addEventListener('close', function(){ setTimeout(connect, 2000); });
    ws.addEventListener('error', function(){ try { ws.close(); } catch (e) {} });
  }
  connect();

  function highlightCurrent(){
    var currentPill = null;
    homeGrid.querySelectorAll('.bookPill').forEach(function(pill){
      var isCurrent = !!activeBookId && pill.dataset.bookId === activeBookId;
      pill.classList.toggle('current', isCurrent);
      if (isCurrent) currentPill = pill;
    });
    if (currentPill && homeGrid.firstElementChild !== currentPill) {
      homeGrid.insertBefore(currentPill, homeGrid.firstChild);
    }
  }

  async function renderBooks(){
    homeGrid.innerHTML = '';
    var res;
    try {
      res = await fetch('/api/books').then(function(r){ return r.json(); });
    } catch (e) {
      homeGrid.innerHTML = '<p id="emptyMsg">Could not reach the server.</p>';
      return;
    }
    (res.books || []).forEach(function(book){
      var pill = document.createElement('div');
      pill.className = 'bookPill';
      pill.dataset.bookId = book.id;

      var cover = document.createElement('img');
      cover.className = 'bookCover';
      cover.src = '/api/books/' + book.id + '/cover';
      cover.onerror = function(){
        cover.replaceWith(Object.assign(document.createElement('div'), { className: 'bookCoverPlaceholder', innerHTML: '&#9834;' }));
      };
      pill.appendChild(cover);

      var titleEl = document.createElement('div');
      titleEl.className = 'bookTitle';
      titleEl.textContent = book.title;
      pill.appendChild(titleEl);

      var authorEl = document.createElement('div');
      authorEl.className = 'bookAuthor';
      authorEl.textContent = book.author || '';
      pill.appendChild(authorEl);

      pill.addEventListener('click', function(){
        location.href = 'chapter.html?book=' + encodeURIComponent(book.id) + '&mode=' + mode;
      });

      homeGrid.appendChild(pill);
    });
    highlightCurrent();
  }

  renderBooks();
})();
</script>
</body>
</html>
