<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
<!-- Favicon: black circle, orange "S", no outline - inline SVG data URI so
     no separate asset file is needed. Same icon should be reused on every
     other page as they're built/rewritten (library/chapter/player/remote/
     tv-player). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b0b0d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Roboto, Arial, sans-serif' font-weight='700' font-size='20' fill='%23e08a3c'%3ES%3C/text%3E%3C/svg%3E">
<title>SHAMA</title>
<!--
  LAYER 1 of the app-shell rebuild (see CLAUDE.md for the full layer map).
  This is now purely a mode-picker: SHAMA + subtitle + two neutral Player/
  Remote pills, nothing else. Reads nothing from the server, holds no mode
  flag of its own (the flag only exists from the moment a jump into
  library.html/chapter.html happens), makes no WebSocket connection. Both
  pills are styled identically - neither represents a "current" mode,
  unlike every downstream page's mode-indicator pill.

  Clicking Player -> library.html. Clicking Remote -> remote.html directly
  (remote.html's own Library/Chapter icons are what carry the remote flag
  into book/chapter browsing from there - see remote.html for that path).
-->
<style>
  :root {
    --bg:#0b0b0d; --ink:#e8e6ea; --muted:#9b93b0; --border:#3a3840; --accent:#e08a3c;
  }
  :root.light {
    --bg:#e5decf; --ink:#000000; --muted:#7a6f58; --border:#b8ab8e; --accent:#e08a3c;
  }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Roboto","Arial",sans-serif;
  }
  body {
    display:flex; flex-direction:column; align-items:stretch; justify-content:center;
    box-sizing:border-box; padding:24px 16px; text-align:center;
  }

  #homeTitle, #homeSubtitle { color:var(--ink); margin:0 auto; }
  .subtitleInitial { font-weight:700; color:var(--accent); }

  /* Title/subtitle/mode-row all share one width rule: a fixed 800px above
     1080px viewport width, flexing to 80% of the viewport (10% padding
     each side) below it. font-size is never hardcoded - fitHomeHeader()
     measures each text element's natural width at a baseline size and
     scales it proportionally to snugly fill this box. */
  #homeTitle, #homeSubtitle, #modeRow {
    width:800px; max-width:800px; box-sizing:border-box;
  }
  @media (max-width:1080px) {
    #homeTitle, #homeSubtitle, #modeRow { width:80vw; max-width:80vw; }
  }
  #homeTitle {
    font-weight:700; letter-spacing:0.2em; white-space:nowrap; font-size:8rem; margin:0 auto;
    /* No margin-based letter-spacing compensation here (unlike the
       original auto-width/text-align design this was ported from) - this
       box has an EXPLICIT fixed width (800px/80vw) that fitTextToWidth()
       already scales the text to fill almost exactly, so plain symmetric
       margin:auto centers the box correctly on its own. Solving
       margin-left against a fixed margin-right (the old trick) assumes
       auto-width content and produces a large wrong offset against a
       fixed width instead - confirmed via direct measurement. */
  }
  #homeSubtitle { font-weight:300; white-space:nowrap; font-size:28px; text-transform:uppercase; }
  @media (max-width:1080px) {
    #homeSubtitle { display:none; }
  }

  #modeRow { display:flex; gap:14px; margin-left:auto; margin-right:auto; }
  .modePill {
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    height:46px; box-sizing:border-box; border-radius:999px; border:1px solid var(--border);
    color:var(--ink); text-decoration:none; font-size:16.8px; font-weight:600;
    font-family:"Roboto","Arial",sans-serif; text-transform:uppercase;
  }
  .modePill svg { flex-shrink:0; width:1em; height:1em; color:var(--accent); }

  #footer {
    position:fixed; left:0; right:0; bottom:16px; text-align:center;
    font-family:"Roboto","Arial",sans-serif; font-size:12px; color:var(--muted);
  }
</style>
</head>
<body>

<div id="homeTitle">SHAMA</div>
<div id="homeSubtitle"><span class="subtitleInitial">S</span>tylish <span class="subtitleInitial">H</span>umanlike <span class="subtitleInitial">A</span>udiobook <span class="subtitleInitial">M</span>ultiplatform <span class="subtitleInitial">A</span>pplication</div>
<div id="modeRow">
  <a class="modePill" href="library.html?mode=player">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span>Player</span>
  </a>
  <a class="modePill" href="remote.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="4"/><circle cx="12" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>
    <span>Remote</span>
  </a>
</div>

<div id="footer">SHAMA is a property of UESHAMA &copy;2026 All Rights Reserved.</div>

<script>
(function(){
  var homeTitle = document.getElementById('homeTitle');
  var homeSubtitle = document.getElementById('homeSubtitle');
  var modeRow = document.getElementById('modeRow');

  // Reads whatever theme was last persisted elsewhere in the app, purely
  // for visual consistency - this page has no toggle of its own.
  var theme = 'dark';
  try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  document.documentElement.classList.toggle('light', theme === 'light');

  // Scales #homeTitle/#homeSubtitle's font-size proportionally (not
  // hardcoded) so their rendered text width snugly fills the shared
  // 800px/80vw box all three elements share. Measuring at a baseline size
  // and computing a single scale factor works cleanly since letter-
  // spacing is em-based and therefore already scales linearly with
  // font-size.
  function fitTextToWidth(el, targetWidth){
    if (!targetWidth) return;
    el.style.fontSize = '100px';
    var natural = el.scrollWidth;
    if (natural <= 0) return;
    el.style.fontSize = (100 * (targetWidth / natural) * 0.995) + 'px';
  }

  function fitHomeHeader(){
    fitTextToWidth(homeTitle, homeTitle.clientWidth);
    if (getComputedStyle(homeSubtitle).display !== 'none') {
      fitTextToWidth(homeSubtitle, homeSubtitle.clientWidth);
      modeRow.style.marginTop = (homeSubtitle.offsetHeight / 2) + 'px';
    } else {
      modeRow.style.marginTop = '';
    }
  }
  window.addEventListener('resize', fitHomeHeader);
  fitHomeHeader();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHomeHeader);
})();
</script>
</body>
</html>
