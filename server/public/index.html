</div>

<script src="/bridge-shim.js"></script>
<script>
(function(){
  var homeScreen = document.getElementById('homeScreen');
  var homeGrid = document.getElementById('homeGrid');
  var libraryScreen = document.getElementById('libraryScreen');
  var libraryTitle = document.getElementById('libraryTitle');
  var libraryBody = document.getElementById('libraryBody');
  var allBooksBtn = document.getElementById('allBooksBtn');
  var readerScreen = document.getElementById('readerScreen');

  var audio = document.getElementById('audio');
  var pageText = document.getElementById('pageText');
  var measure = document.getElementById('measure');
  var frame = document.getElementById('frame');
  var loadingOverlay = document.getElementById('loadingOverlay');
  var loadingPercent = document.getElementById('loadingPercent');
  var bookmarkToast = document.getElementById('bookmarkToast');
  var libraryBtn = document.getElementById('libraryBtn');
  var bookmarkBtn = document.getElementById('bookmarkBtn');
  var presetToggleBtn = document.getElementById('presetToggleBtn');
  var volumeToggleBtn = document.getElementById('volumeToggleBtn');
  var volumePopup = document.getElementById('volumePopup');
  var volumeUpBtn = document.getElementById('volumeUpBtn');
  var volumeDownBtn = document.getElementById('volumeDownBtn');
  var volumeLevelPill = document.getElementById('volumeLevelPill');
  var muteBtn = document.getElementById('muteBtn');
  var volumeIconNormal = document.getElementById('volumeIconNormal');
  var volumeIconMuted = document.getElementById('volumeIconMuted');
  var themeToggleBtn = document.getElementById('themeToggleBtn');
  var fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
  var forceZenBtn = document.getElementById('forceZenBtn');
  var zenImageWrap = document.getElementById('zenImageWrap');
  var zenImage = document.getElementById('zenImage');

  var elapsedLabel = document.getElementById('elapsedLabel');
  var totalLabel = document.getElementById('totalLabel');
  var progressTrack = document.getElementById('progressTrack');
  var progressFill = document.getElementById('progressFill');
  var progressMarker = document.getElementById('progressMarker');

  var playerControls = document.getElementById('playerControls');
  var prevChapterBtn = document.getElementById('prevChapterBtn');
  var prevPartBtn = document.getElementById('prevPartBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var nextPartBtn = document.getElementById('nextPartBtn');
  var nextChapterBtn = document.getElementById('nextChapterBtn');

  var coverArt = document.getElementById('coverArt');
  var coverPlaceholder = document.getElementById('coverPlaceholder');
  var chapterTitleEl = document.getElementById('chapterTitle');
  var authorTitleEl = document.getElementById('authorTitle');
  var chapterPill = document.getElementById('chapterPill');

  var speedPill = document.getElementById('speedPill');
  var speedLabel = document.getElementById('speedLabel');
  var speedOverlay = document.getElementById('speedOverlay');
  var speedValue = document.getElementById('speedValue');
  var speedSlider = document.getElementById('speedSlider');
  var speedDown = document.getElementById('speedDown');
  var speedUp = document.getElementById('speedUp');

  var chunks = [];
  var chapterTimeOffset = 0; // see seekToTime() - added to audio.currentTime
                              // to get real chapter-relative time, since a
                              // jumped-to resource reports its own time
                              // starting from 0.
  var idx = -1;
  var shown = false;
  var pendingChapterBase = null;
  var pendingResumeSeconds = null;
  var allChapters = [];
  var chapterDuration = 0;
  var durationKnown = false;
  var currentSpeed = 1.0;
  var scrubbing = false;
  var chunkSpans = [];
  var chunkLitCount = 0;
  var PAD_X = 26, PAD_TOP = 64, PAD_BOTTOM = 26, MAX_F = 68, ABS_MIN = 10;
  // Zen mode's padding, once the status/nav bars also hide (see
  // Android.setImmersiveMode): 1% of screen height top+bottom, 2% of
  // screen width for the image's own buffer from the true right screen
  // edge, 1% of screen width for the text block's buffer from the true
  // left screen edge, and a 2%-of-width gap between text and image.
  var ZEN_TOP_BOTTOM_FRACTION = 0.01;
  var ZEN_LEFT_FRACTION = 0.01;
  var ZEN_RIGHT_FRACTION = 0.02;
  var ZEN_GAP_FRACTION = 0.02;
  // Desktop zen - right-anchored, same as mobile/tablet (see the CSS
  // comment on #readerScreen.zen.desktop #frame for why a centered pair
  // was tried first and reverted), just with its own symmetric padding
  // values instead of mobile's asymmetric ones. Kept in sync with that
  // CSS rule.
  var ZEN_DESKTOP_PADDING_V_FRACTION = 0.03;
  var ZEN_DESKTOP_PADDING_H_FRACTION = 0.03;
  var ZEN_DESKTOP_GAP_FRACTION = 0.02;
  var ZEN_DESKTOP_MIN_WIDTH = 800;

  var zenActive = false;
  var zenDesktopActive = false; // which zen sub-case is active, when zenActive is true
  var zenImageList = [];
  var zenCurrentImageUrl = null;
  // Cached column layout - recomputed only by recalcZenColumns() (on
  // resize/fullscreen-toggle/zen transitions), never per-chunk or per
  // image-rotation, so the image/text split can't visibly shift outside
  // an actual viewport change. See recalcZenColumns() below.
  var zenColW = 0;
  var zenImgColW = 0;
  var zenRowH = 0;

  function chapterNumber(base){
    var m = base.match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : null;
  }

  function humanize(base){
    var n = chapterNumber(base);
    return n !== null ? ('Chapter ' + n) : base;
  }

  function formatTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.round(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var mm = (h > 0 && m < 10) ? ('0' + m) : String(m);
    var ss = sec < 10 ? ('0' + sec) : String(sec);
    return h > 0 ? (h + ':' + mm + ':' + ss) : (m + ':' + ss);
  }

  // Home screen: a pill grid of every configured book, the app's actual
  // entry point. Each pill's cover/title/author come straight from
  // /api/books (server-resolved: book.json title, else the first
  // chapter's ID3 album/artist tags, else the folder id) - no per-book
  // metadata round-trip needed client-side. Current book (selectBook()'s
  // choice, persisted in localStorage) is always sorted first.
  async function renderHome(){
    homeGrid.innerHTML = '';
    var booksRes;
    try {
      booksRes = JSON.parse(await Android.listBooks());
    } catch(e){
      homeGrid.innerHTML = '<p id="emptyMsg">Could not read the configured book folders.</p>';
      return;
    }
    var books = booksRes.books || [];
    var currentBookId = await Android.currentBookId();
    // Falls back to the first configured book if nothing's selected yet,
    // or a previously-selected id no longer exists (e.g. config.json
    // changed since) - same fallback listChapters() applies separately.
    if (!books.some(function(b){ return b.id === currentBookId; })) {
      currentBookId = books.length ? books[0].id : null;
    }
    books.sort(function(a, b){
      if (a.id === currentBookId) return -1;
      if (b.id === currentBookId) return 1;
      return 0;
    });

    books.forEach(function(book){
      var pill = document.createElement('div');
      pill.className = 'bookPill' + (book.id === currentBookId ? ' current' : '');

      var cover = document.createElement('img');
      cover.className = 'bookCover';
      cover.src = '/api/books/' + book.id + '/cover';
      cover.onerror = function(){
        cover.replaceWith(Object.assign(document.createElement('div'), {
          className: 'bookCoverPlaceholder', innerHTML: '&#9834;'
        }));
      };
      pill.appendChild(cover);

      var titleEl = document.createElement('div');
      titleEl.className = 'bookTitle';
      titleEl.textContent = book.title;
      pill.appendChild(titleEl);

      var authorEl = document.createElement('div');
      authorEl.className = 'bookAuthor';
      authorEl.textContent = book.author || '';
      pill.appendChild(authorEl);

      pill.addEventListener('click', async function(){
        await Android.selectBook(book.id);
        homeScreen.style.display = 'none';
        libraryScreen.style.display = 'flex';
        renderLibrary();
      });

      homeGrid.appendChild(pill);
    });
  }

  function goHome(){
    libraryScreen.style.display = 'none';
    homeScreen.style.display = 'block';
    renderHome();
  }

  allBooksBtn.addEventListener('click', goHome);

  async function renderLibrary(){
    var data;
    try {
      data = JSON.parse(await Android.listChapters());
    } catch(e){
      libraryBody.innerHTML = '<p id="emptyMsg">Could not read the library folder.</p>';
      return;
    }

    libraryBody.innerHTML = '';

    if(!data.hasFolder){
      var btn = document.createElement('button');
      btn.id = 'chooseFolderBtn';
      btn.textContent = 'Choose audiobook folder';
      btn.addEventListener('click', function(){ Android.pickFolder(); });
      libraryBody.appendChild(btn);
      allChapters = [];
      return;
    }

    allChapters = data.chapters || [];

    // Left column: same cover/title/author pill as the home screen grid,
    // just not clickable here (this already *is* the selected book).
    var leftCol = document.createElement('div');
    leftCol.className = 'bookPill libraryBookPill';
    var cover = document.createElement('img');
    cover.className = 'bookCover';
    cover.src = '/api/books/' + data.bookId + '/cover';
    cover.onerror = function(){
      cover.replaceWith(Object.assign(document.createElement('div'), {
        className: 'bookCoverPlaceholder', innerHTML: '&#9834;'
      }));
    };
    leftCol.appendChild(cover);
    var leftTitle = document.createElement('div');
    leftTitle.className = 'bookTitle';
    leftTitle.textContent = data.bookTitle || 'JP Audiobook Player';
    leftCol.appendChild(leftTitle);
    var leftAuthor = document.createElement('div');
    leftAuthor.className = 'bookAuthor';
    leftAuthor.textContent = data.bookAuthor || '';
    leftCol.appendChild(leftAuthor);

    // Left column wrapper: album art pill, then Continue directly below
    // it (if a resume position exists) - same relative DOM position
    // works for both the >=800px side-by-side layout (Continue sits
    // under the art pill within this one stacked unit) and the <800px
    // single-column layout (this whole wrapper is "the first thing",
    // so Continue naturally lands right after the art there too,
    // without needing separate positioning logic per breakpoint).
    var leftColWrap = document.createElement('div');
    leftColWrap.id = 'libraryLeftColWrap';
    leftColWrap.appendChild(leftCol);
    libraryBody.appendChild(leftColWrap);

    var extra = { lastPosition: null, bookmarks: [] };
    try { extra = JSON.parse(await Android.listBookmarksAndLastPosition()); } catch(e){}

    if (extra.lastPosition) {
      var continuePill = document.createElement('button');
      continuePill.className = 'chapterPill continuePill';
      continuePill.textContent = 'Continue: ' + humanize(extra.lastPosition.chapterBase) +
        ' (' + formatTime(extra.lastPosition.positionSeconds) + ')';
      continuePill.addEventListener('click', function(){
        openChapter(extra.lastPosition.chapterBase, extra.lastPosition.positionSeconds);
      });
      leftColWrap.appendChild(continuePill);
    }

    // Right column: chapter pills (no Continue mixed in anymore) + bookmarks.
    var rightCol = document.createElement('div');
    rightCol.id = 'libraryRightCol';

    var chapterWrap = document.createElement('div');
    chapterWrap.id = 'chapterPillsWrap';
    rightCol.appendChild(chapterWrap);
    libraryBody.appendChild(rightCol);

    if (data.chapters.length === 0) {
      var msg = document.createElement('p');
      msg.id = 'emptyMsg';
      msg.textContent = 'No chapter_XXX.mp3 files found in this folder yet.';
      chapterWrap.appendChild(msg);
    } else {
      var makeChapterPill = function(base){
        var pill = document.createElement('button');
        pill.className = 'chapterPill';
        pill.textContent = humanize(base);
        pill.addEventListener('click', function(){ openChapter(base); });
        return pill;
      };

      // Single column first, Chapter 1, 2, 3... in order. chapterWrap is
      // already attached to the live document (appended above), so its
      // measured height below reflects real layout, not a detached-node
      // zero.
      var singleCol = document.createElement('div');
      singleCol.className = 'pillWrap';
      data.chapters.forEach(function(base){ singleCol.appendChild(makeChapterPill(base)); });
      chapterWrap.appendChild(singleCol);

      if (singleCol.getBoundingClientRect().height > 400) {
        // Doesn't fit - rebuild as two explicit sub-columns rather than
        // relying on flex-wrap's row-major order, so the left sub-column
        // fills with 1, 2, 3... first (as many as fit in 400px) and the
        // rest continue into the right sub-column, which is allowed to
        // grow past 400px if even that overflows.
        chapterWrap.innerHTML = '';
        var GAP = 8, PILL_H = 35;
        var capacity = Math.max(1, Math.floor((400 + GAP) / (PILL_H + GAP)));
        var leftChapters = data.chapters.slice(0, capacity);
        var rightChapters = data.chapters.slice(capacity);

        var twoColRow = document.createElement('div');
        twoColRow.className = 'twoColRow';
        var leftSubCol = document.createElement('div');
        leftSubCol.className = 'pillWrap';
        leftChapters.forEach(function(base){ leftSubCol.appendChild(makeChapterPill(base)); });
        var rightSubCol = document.createElement('div');
        rightSubCol.className = 'pillWrap';
        rightChapters.forEach(function(base){ rightSubCol.appendChild(makeChapterPill(base)); });
        twoColRow.appendChild(leftSubCol);
        twoColRow.appendChild(rightSubCol);
        chapterWrap.appendChild(twoColRow);
      }
    }

    renderBookmarksSection(rightCol, extra.bookmarks || []);
  }

  var DELETE_WIDTH = 72;

  // Swipe-to-reveal-delete bookmark list, "under" the Change folder
  // button. Only one row can be open at a time; a tap while a row is
  // already open just closes it instead of navigating (standard
  // swipe-list convention), a tap while closed resumes to that bookmark.
  function renderBookmarksSection(rightCol, bookmarks){
    if (!bookmarks.length) return;

    var section = document.createElement('div');
    var label = document.createElement('div');
    label.className = 'sectionLabel';
    label.textContent = 'Bookmarks';
    section.appendChild(label);
    var bookmarkWrapEl = document.createElement('div');
    bookmarkWrapEl.className = 'pillWrap';
    section.appendChild(bookmarkWrapEl);
    rightCol.appendChild(section);

    var openRowWrap = null;

    bookmarks.forEach(function(bm){
      var wrap = document.createElement('div');
      wrap.className = 'bookmarkWrap';

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'bookmarkDelete';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', async function(){
        // Awaited (unlike the Android version, where this bridge call was
        // synchronous) so renderLibrary() doesn't re-render against a
        // still-stale bookmark list while the delete is in flight.
        await Android.deleteBookmark(bm.id);
        renderLibrary();
      });

      var row = document.createElement('button');
      row.className = 'chapterPill bookmarkRow';
      row.textContent = bm.label + ' — ' + humanize(bm.chapterBase);
      row.style.touchAction = 'pan-y';

      var isOpen = false;
      var dragStartX = null;
      var baseX = 0;

      function setOffset(px){
        row.style.transform = 'translateX(' + px + 'px)';
      }

      wrap._closeBookmarkRow = function(){
        isOpen = false;
        row.style.transition = 'transform 0.2s';
        setOffset(0);
      };

      row.addEventListener('pointerdown', function(e){
        dragStartX = e.clientX;
        baseX = isOpen ? -DELETE_WIDTH : 0;
        row.style.transition = 'none';
        try { row.setPointerCapture(e.pointerId); } catch(err){}
      });

      row.addEventListener('pointermove', function(e){
        if (dragStartX === null) return;
        var offset = baseX + (e.clientX - dragStartX);
        offset = Math.max(-DELETE_WIDTH, Math.min(0, offset));
        setOffset(offset);
      });

      row.addEventListener('pointerup', function(e){
        if (dragStartX === null) return;
        var dx = e.clientX - dragStartX;
        dragStartX = null;
        row.style.transition = 'transform 0.2s';

        if (Math.abs(dx) < 8) {
          // Tap, not a drag.
          if (isOpen) {
            wrap._closeBookmarkRow();
          } else {
            openChapter(bm.chapterBase, bm.positionSeconds);
          }
          return;
        }

        var finalOffset = baseX + dx;
        if (finalOffset <= -DELETE_WIDTH / 2) {
          if (openRowWrap && openRowWrap !== wrap) openRowWrap._closeBookmarkRow();
          openRowWrap = wrap;
          isOpen = true;
          setOffset(-DELETE_WIDTH);
        } else {
          isOpen = false;
          setOffset(0);
        }
      });

      row.addEventListener('pointercancel', function(){
        dragStartX = null;
      });

      wrap.appendChild(deleteBtn);
      wrap.appendChild(row);
      bookmarkWrapEl.appendChild(wrap);
    });
  }

  window.onFolderPicked = function(){
    renderLibrary();
  };

  function goToLibrary(){
    audio.pause();
    readerScreen.style.display = 'none';
    libraryScreen.style.display = 'flex';
    Android.stopPlaybackSession();
    try { Android.setImmersiveMode(false); } catch(e){}
    // Without this, the screen just re-shows whatever DOM renderLibrary()
    // last built (e.g. from when the book was first selected) - stale
    // Continue pill / bookmark list, since neither updates live while
    // reading. Re-fetch so a bookmark just saved (or resume position just
    // moved) shows up without a detour through the home screen.
    renderLibrary();
  }

  async function openChapter(base, resumeSeconds){
    var syncText = await Android.readTextFile(base + '.sync.json');
    var data;
    try {
      data = JSON.parse(syncText);
    } catch(e){
      alert('Could not read ' + base + '.sync.json');
      return;
    }
    chunks = data.chunks || [];
    idx = -1;
    shown = false;
    audio.pause();

    pendingChapterBase = base;
    pendingResumeSeconds = (typeof resumeSeconds === 'number' && resumeSeconds > 0) ? resumeSeconds : null;
    durationKnown = false;
    chapterDuration = chunks.length ? chunks[chunks.length - 1].end : 0;
    totalLabel.textContent = formatTime(chapterDuration);
    elapsedLabel.textContent = '0:00';
    renderTimeUI(0);

    chapterTitleEl.textContent = humanize(base);
    authorTitleEl.textContent = '';
    coverArt.style.display = 'none';
    coverPlaceholder.style.display = 'flex';
    updateChapterPill();

    libraryScreen.style.display = 'none';
    readerScreen.style.display = 'flex';
    pageText.style.display = 'none';
    loadingOverlay.style.display = 'block';
    loadingPercent.textContent = '0';

    Android.prepareChapterAudio(base);
  }

  window.onAudioPrepareProgress = function(base, percent){
    if (base !== pendingChapterBase) return;
    loadingPercent.textContent = percent;
  };

  window.onAudioPrepareReady = async function(base, metadataJson){
    if (base !== pendingChapterBase) return;
    loadingOverlay.style.display = 'none';
    pageText.style.display = 'flex';

    // Metadata/zen-images resolved BEFORE the first updateForTime() call
    // below (not after, despite matching the original call order more
    // closely) - updateForTime() is what actually shows the zen image via
    // updateZenImageForTime(), and it needs coverArt.src (the ID3-cover
    // fallback) and zenImageList already in place on its very first tick,
    // not one tick later. Awaited (unlike the Android version, where the
    // equivalent bridge call was synchronous) since resolveChapterImages
    // is now a real fetch() - without the await, applyZenState() below
    // could run against a still-empty zenImageList.
    var meta = {};
    try { meta = JSON.parse(metadataJson || '{}'); } catch(e){}
    applyMetadata(meta);
    await loadZenImagesForChapter(base);
    // If the phone's already physically landscape, start directly in zen
    // mode rather than requiring an extra rotation round-trip.
    applyZenState();

    var resumeSeconds = pendingResumeSeconds;
    pendingResumeSeconds = null;

    if (resumeSeconds) {
      // seekToTime() only ever sets audio.currentTime - it assumes a
      // source is already loaded (true for every other call site: drag-
      // to-seek/next-part/prev-part all act on a chapter that's already
      // playing). This is the one call site opening a chapter fresh, so
      // audio.src has to be set here too, same as the plain-open branch
      // below - without it, currentTime/play() are silent no-ops against
      // an empty <audio> element (readyState 0), which read as a fully
      // stuck player: progress bar frozen, next/prev part unable to
      // recover since they also just call seekToTime(); only opening a
      // different chapter worked, since that goes through the plain-open
      // branch below and sets src there.
      chapterTimeOffset = 0;
      audio.src = window.audioUrl(base);
      audio.playbackRate = currentSpeed;
      // seekToTime() only resumes playback itself if audio was already
      // playing before the seek (drag-to-seek/next/prev case) - nothing
      // has played yet here, so it won't auto-play on its own; call
      // play() explicitly, same as the fresh-open branch below already does.
      seekToTime(resumeSeconds);
      audio.play().catch(function(e){ console.log('resume autoplay failed: ' + e); });
    } else {
      chapterTimeOffset = 0;
      audio.src = window.audioUrl(base);
      audio.playbackRate = currentSpeed;
      updateForTime(0);
      audio.play().catch(function(e){ console.log('autoplay failed: ' + e); });
    }
  };

  window.onAudioPrepareFailed = function(base, reason){
    if (base !== pendingChapterBase) return;
    alert('Could not prepare audio for ' + base + ': ' + reason + ' - check Logcat (tag ChapterAudio) for details.');
    loadingOverlay.style.display = 'none';
    pageText.style.display = 'flex';
    readerScreen.style.display = 'none';
    libraryScreen.style.display = 'flex';
  };

  function applyMetadata(meta){
    // Top line is the author - the chapter identity is already covered by
    // chapterPill (e.g. "Chapter 2/2"), so this line is more useful showing
    // who's reading/writing. Falls back to the chapter title tag, then
    // whatever openChapter() already put there (humanizeChapterName), if
    // there's no artist tag.
    var title = (meta.title || '').trim();
    var author = (meta.artist || '').trim();
    var album = (meta.album || '').trim();
    if (author) {
      chapterTitleEl.textContent = author;
    } else if (title) {
      chapterTitleEl.textContent = title;
    }

    // Bottom line is the book title alone now (author moved up) - stretched
    // across its row by .marqueeBox's flex:1 already, scrolls via
    // setupMarquee() if it doesn't fit.
    setupMarquee(authorTitleEl, album);

    if (meta.hasCover) {
      coverArt.src = window.coverUrl(pendingChapterBase);
      coverArt.style.display = 'block';
      coverPlaceholder.style.display = 'none';
    } else {
      coverArt.style.display = 'none';
      coverPlaceholder.style.display = 'flex';
    }
  }

  function setupMarquee(el, text){
    el.classList.remove('scrolling');
    el.innerHTML = '';
    if (!text) return;

    var inner = document.createElement('span');
    inner.className = 'marqueeInner';
    var first = document.createElement('span');
    first.textContent = text;
    inner.appendChild(first);
    var gap = document.createElement('span');
    gap.className = 'marqueeGap';
    inner.appendChild(gap);
    var second = document.createElement('span');
    second.textContent = text;
    inner.appendChild(second);
    el.appendChild(inner);

    requestAnimationFrame(function(){
      if (inner.scrollWidth > el.clientWidth * 1.9) {
        var singleWidth = inner.scrollWidth / 2;
        var duration = Math.max(6, singleWidth / 40);
        inner.style.animationDuration = duration + 's';
        el.classList.add('scrolling');
      } else {
        second.remove();
        gap.remove();
      }
    });
  }

  // Numerator/denominator are the real chapter numbers parsed from the
  // filenames, not folder-relative position - chapters get copied to the
  // phone in batches and old ones deleted after reading, so the folder
  // is rarely a contiguous 1..N run (e.g. only chapters 5-10 present
  // should read "5/10" while chapter 5 is open, not "1/6").
  function updateChapterPill(){
    var chapterIndex = chapterNumber(pendingChapterBase) || 0;
    var chapterTotal = allChapters.reduce(function(max, base){
      var n = chapterNumber(base);
      return (n !== null && n > max) ? n : max;
    }, 0);
    var chunkPos = idx >= 0 ? (idx + 1) : 0;
    chapterPill.textContent = 'Chapter: ' + chapterIndex + '/' + chapterTotal + ' Part: ' + chunkPos + '/' + chunks.length;
    updateChapterNavButtons();
  }

  // Prev/Next Chapter (the player-controls row's bigger jump, vs.
  // Prev/Next Part which is the existing goPrev()/goNext() chunk seek) -
  // grey out at the ends of allChapters, same list continuous playback
  // (the 'ended' handler below) already walks.
  function updateChapterNavButtons(){
    var pos = allChapters.indexOf(pendingChapterBase);
    prevChapterBtn.disabled = !(pos > 0);
    nextChapterBtn.disabled = !(pos >= 0 && pos < allChapters.length - 1);
    updatePlayerControlsFit();
  }

  function goPrevChapter(){
    var pos = allChapters.indexOf(pendingChapterBase);
    if (pos > 0) openChapter(allChapters[pos - 1]);
  }

  function goNextChapter(){
    var pos = allChapters.indexOf(pendingChapterBase);
    if (pos >= 0 && pos < allChapters.length - 1) openChapter(allChapters[pos + 1]);
  }

  // Which buttons show is decided by measuring the row itself, not a
  // fixed viewport-width breakpoint - #playerControls is a stretched grid
  // child of #metaRow's middle (1fr) column, so its clientWidth already
  // equals the real leftover width between the left info block and the
  // right pill column. Chapter-skip buttons drop first (bigger jump, less
  // essential at a glance), then part-skip, leaving just play/pause - the
  // same fit check both decides "not enough width for all buttons" and
  // guarantees the row can never grow wide enough to crowd its neighbors,
  // since dropping buttons only ever shrinks the centered group symmetrically.
  var PLAYER_CONTROLS_BTN = 36;
  var PLAYER_CONTROLS_GAP = 20;
  function playerControlsRowWidth(n){
    return n * PLAYER_CONTROLS_BTN + (n - 1) * PLAYER_CONTROLS_GAP;
  }
  function updatePlayerControlsFit(){
    playerControls.classList.remove('hide-chapter', 'hide-part');
    var available = playerControls.clientWidth;
    if (playerControlsRowWidth(5) <= available) return;
    playerControls.classList.add('hide-chapter');
    if (playerControlsRowWidth(3) <= available) return;
    playerControls.classList.add('hide-part');
  }
  window.addEventListener('resize', updatePlayerControlsFit);

  function fitFontSize(text, availW, availH){
    measure.style.height = availH + 'px';
    for(var f = MAX_F; f >= ABS_MIN; f -= 1){
      measure.style.fontSize = f + 'px';
      measure.textContent = text;
      if(measure.scrollWidth <= availW) return f;
    }
    return ABS_MIN;
  }

  // Recomputes the cached zen column widths (zenColW/zenImgColW/zenRowH)
  // against the frame's *current* box - called only from genuine
  // layout-changing events (resize, fullscreen toggle, zen state
  // transitions), never per-chunk and never when the side image simply
  // rotates to a different picture. The image and text columns split
  // the available width evenly (not "image gets its natural aspect-ratio
  // width, text gets whatever's left") - previously, since a different
  // image (chapter-image rotation, a new chapter, or the ID3-cover
  // fallback) almost always has a different aspect ratio, giving the
  // image an auto width let it (and consequently the text next to it)
  // visibly resize/reposition every time the picture changed, which
  // wasn't a pleasant reading experience. Fixed, evenly-split columns
  // plus #zenImage's object-fit:contain (see the CSS) mean a
  // differently-shaped image just letterboxes within its own unchanged
  // box instead of resizing it.
  function recalcZenColumns(){
    if (!zenActive) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var leftPad, rightPad, topBottomPad, gapW;
    if (zenDesktopActive) {
      // Centered pair - symmetric padding, no "leftover space" side.
      leftPad = vw * ZEN_DESKTOP_PADDING_H_FRACTION;
      rightPad = leftPad;
      topBottomPad = vh * ZEN_DESKTOP_PADDING_V_FRACTION;
      gapW = vw * ZEN_DESKTOP_GAP_FRACTION;
    } else {
      leftPad = vw * ZEN_LEFT_FRACTION;
      rightPad = vw * ZEN_RIGHT_FRACTION;
      topBottomPad = vh * ZEN_TOP_BOTTOM_FRACTION;
      gapW = vw * ZEN_GAP_FRACTION;
    }
    var innerW = frame.clientWidth - leftPad - rightPad;
    var imgH = frame.clientHeight - topBottomPad * 2;
    var colW = (innerW - gapW) / 2;
    zenImgColW = Math.max(20, colW);
    zenColW = Math.max(40, colW);
    zenRowH = imgH;
    zenImageWrap.style.width = zenImgColW + 'px';
    zenImageWrap.style.height = zenRowH + 'px';
  }

  // Outside zen mode (or zen with no image resolved for this chapter -
  // e.g. no folder images and no ID3 cover either): same math as
  // before, just the asymmetric top padding that clears the icon
  // buttons. In zen mode, this is now just a cheap read of the cached
  // column widths recalcZenColumns() already computed - see there for
  // why the split is fixed/even rather than measured fresh here.
  function getAvailableSpace(){
    if (!zenActive || zenImageWrap.style.display === 'none') {
      return {
        w: frame.clientWidth - PAD_X * 2,
        h: frame.clientHeight - PAD_TOP - PAD_BOTTOM
      };
    }
    return { w: zenColW, h: zenRowH };
  }

  function showPage(i){
    var chunk = chunks[i];
    var space = getAvailableSpace();
    var f = fitFontSize(chunk.text, space.w, space.h);
    // Text block's height is synced to the zen image's rendered height so
    // their top/bottom edges align (spec: "vertically centered as a
    // pair"); '' outside zen falls back to the normal CSS height:100% rule.
    pageText.style.height = (zenActive && zenImageWrap.style.display !== 'none') ? (space.h + 'px') : '';
    pageText.style.opacity = '0';
    pageText.style.fontSize = f + 'px';

    // One span per character (not per textContent string) so playback
    // progress through the chunk can be shown by recoloring characters
    // one at a time - see updateChunkHighlight(). Array.from (not a plain
    // for-loop over string indices) so a surrogate-pair character doesn't
    // get split across two spans.
    pageText.innerHTML = '';
    chunkSpans = Array.from(chunk.text).map(function(ch){
      var span = document.createElement('span');
      span.textContent = ch;
      pageText.appendChild(span);
      return span;
    });

    // Chromium can cache pageText's wrapped-column width from before this
    // batch of per-character spans went in and not recompute it - it then
    // renders as one long unwrapped column overflowing past the frame
    // instead of wrapping into a new one, until something forces a real
    // style invalidation. A display toggle forces that reliably, and it's
    // invisible here since it happens inside the opacity:0 window above,
    // before the fade-in below.
    pageText.style.display = 'none';
    void pageText.offsetHeight;
    pageText.style.display = '';

    // The first PRELIT_COUNT characters read as already "caught up" the
    // instant the page appears, rather than visibly waiting for playback
    // progress to reach them - matches the natural lead-in beat of the
    // narration for those first couple of characters.
    chunkLitCount = Math.min(PRELIT_COUNT, chunkSpans.length);
    applyInitialSpanState();

    requestAnimationFrame(function(){ pageText.style.opacity = '1'; });
  }

  function blankPage(){
    pageText.style.opacity = '0';
    pageText.innerHTML = '';
    chunkSpans = [];
    chunkLitCount = 0;
  }

  // --- Zen mode: distraction-free side-image layout, with two entirely
  // independent triggers depending on device class:
  //
  // Mobile/tablet (coarse pointer): physically rotating to landscape
  // (like a video player going fullscreen), not a manual toggle - rides
  // Android's/the OS's own rotation pipeline via matchMedia rather than
  // a raw sensor, so "never trigger zen mode when rotation-lock is on"
  // comes for free with zero native code. A coarse (touch) pointer is
  // required alongside the orientation match because a plain
  // "(orientation: landscape)" match is true for essentially any normal
  // desktop/laptop browser window (width > height is the common case,
  // not a deliberate rotation) - confirmed by actually testing this
  // build in a desktop-shaped browser window.
  //
  // Desktop (fine pointer): purely window-width-driven, live on resize -
  // no rotation concept applies. This is a *different* zen sub-case
  // (.zen.desktop, its own symmetric padding - see the CSS) and does
  // NOT by itself hide any chrome;
  // that's the separate, independent .chrome-hidden layer below, driven
  // by real fullscreen (since desktop has no rotation to reveal/hide
  // chrome against, and resizing the window shouldn't surprise-hide the
  // icon row).
  var zenMql = window.matchMedia('(orientation: landscape)');
  var zenCoarsePointerMql = window.matchMedia('(pointer: coarse)');

  function applyZenState(){
    if (readerScreen.style.display !== 'flex') return; // only while a chapter's open
    var mobileMatch = zenMql.matches && zenCoarsePointerMql.matches;
    var desktopMatch = !zenCoarsePointerMql.matches && window.innerWidth >= ZEN_DESKTOP_MIN_WIDTH;
    var next = mobileMatch || desktopMatch;
    var stateChanged = (next !== zenActive) || (desktopMatch !== zenDesktopActive);
    // Nothing to do: zen wasn't active and still isn't (the common case
    // on every plain resize/mousemove-driven call while just reading
    // normally). If zen IS active, though, still fall through even when
    // stateChanged is false - a resize while already in zen (e.g.
    // dragging a desktop window wider) needs recalcZenColumns() to
    // re-run, which is exactly the "column width only changes on a real
    // viewport change, never per-chunk" fix this exists for.
    if (!stateChanged && !zenActive) return;

    var wasMobileZen = zenActive && !zenDesktopActive;
    zenActive = next;
    zenDesktopActive = desktopMatch;

    if (stateChanged) {
      readerScreen.classList.toggle('zen', zenActive);
      readerScreen.classList.toggle('desktop', zenDesktopActive);
      if (mobileMatch !== wasMobileZen) {
        // Only the mobile path drives real OS immersive mode and the
        // initial chrome-hidden state on entry - desktop's chrome
        // visibility is driven entirely separately, by real fullscreen
        // (see applyDesktopFullscreenChrome() below).
        try { Android.setImmersiveMode(mobileMatch); } catch(e){}
        readerScreen.classList.toggle('chrome-hidden', mobileMatch);
      }
    }

    if (zenActive) recalcZenColumns();
    if (shown && idx >= 0) showPage(idx);
    updateZenImageForTime((audio.currentTime || 0) + chapterTimeOffset);
  }

  if (zenMql.addEventListener) zenMql.addEventListener('change', applyZenState);
  else zenMql.addListener(applyZenState); // older WebView fallback
  // Belt-and-suspenders: some OEM WebViews may fire resize before (or
  // instead of) the matchMedia change event on rotation - also how the
  // desktop width-based trigger above is kept live while resizing.
  window.addEventListener('resize', applyZenState);

  // Mobile/tablet zen: pausing reveals the icon row + progress/info row
  // (like a video player showing controls when paused), playing again
  // hides them - independent of .zen itself, which stays on throughout.
  // No-op outside mobile zen (desktop chrome is fullscreen-driven, not
  // playback-driven).
  function updateChromeForPlaybackState(){
    if (!zenActive || zenDesktopActive) return;
    readerScreen.classList.toggle('chrome-hidden', !audio.paused);
  }

  // Manual zen override (mobile/tablet only, see the (pointer: coarse)
  // CSS gate on #forceZenBtn) for users with rotation-lock on, who can
  // never satisfy zenMql.matches. Forces the same .zen/.chrome-hidden
  // state applyZenState() would set for a real rotation, independent of
  // actual orientation; tapping again releases the override back to
  // whatever the real orientation/width would naturally produce.
  var zenForcedOn = false;
  forceZenBtn.addEventListener('click', function(){
    zenForcedOn = !zenForcedOn;
    forceZenBtn.classList.toggle('active', zenForcedOn);
    if (readerScreen.style.display !== 'flex') return;
    if (zenForcedOn) {
      zenActive = true;
      zenDesktopActive = false;
      readerScreen.classList.add('zen');
      readerScreen.classList.remove('desktop');
      readerScreen.classList.add('chrome-hidden');
      try { Android.setImmersiveMode(true); } catch(e){}
      recalcZenColumns();
      if (shown && idx >= 0) showPage(idx);
      updateZenImageForTime((audio.currentTime || 0) + chapterTimeOffset);
      // Chrome-hidden on mobile is otherwise only reachable by playing
      // (see updateChromeForPlaybackState()) - auto-play here so forcing
      // zen is a single tap that actually delivers hidden chrome +
      // running audio, instead of forcing zen then still needing a
      // separate tap-to-play on the text area.
      if (audio.paused) audio.play();
    } else {
      // Release the override, then let the real orientation/width decide.
      // Set to a value that can never equal applyZenState()'s freshly
      // computed "next" (true/false) so its no-op guard can't short
      // circuit here and skip actually re-applying the real state -
      // found via testing: setting zenActive to a real boolean first
      // let the guard see "no change" and leave the stale .zen/
      // .chrome-hidden classes in place even though the state had
      // genuinely changed (forced -> real).
      zenActive = null;
      applyZenState();
    }
  });

  // --- Desktop-only: real fullscreen (F11 itself is invisible to the
  // page - it fires no event and leaves document.fullscreenElement null,
  // confirmed before building this - only requestFullscreen()/
  // exitFullscreen(), triggered from an in-page control, is detectable).
  // #fullscreenToggleBtn calls that directly; fullscreenchange reacts to
  // the resulting state regardless of what caused it. Chrome visibility
  // here is intentionally independent of .zen/.desktop (see above) -
  // entering fullscreen at <800px still hides chrome around the
  // plain text-only layout.
  function applyDesktopFullscreenChrome(){
    if (zenCoarsePointerMql.matches) return; // desktop-only
    var fs = !!document.fullscreenElement;
    readerScreen.classList.toggle('chrome-hidden', fs);
    // Chrome-as-overlay (see #zenChromeOverlay's CSS) only makes sense
    // while chrome can actually toggle away - true fullscreen here, or
    // mobile's own play/pause-driven toggle. In a normal (non-fullscreen)
    // desktop window, chrome is always visible regardless of zen state
    // (chrome-hidden above is only ever set when fs is true), so there's
    // nothing to reclaim space from by floating it - it should just sit
    // in normal flow under #frame like it always did outside zen.
    readerScreen.classList.toggle('fullscreen', fs);
    clearTimeout(desktopChromeHideTimer);
    fullscreenToggleBtn.classList.toggle('active', fs);
    // Entering/exiting fullscreen changes the frame's available box
    // (browser toolbar/tabs appearing or disappearing) even when
    // window.innerWidth doesn't change - recompute the (still fixed,
    // evenly-split) columns against the new box rather than leaving
    // stale ones in place.
    if (zenActive) {
      recalcZenColumns();
      if (shown && idx >= 0) showPage(idx);
      updateZenImageForTime((audio.currentTime || 0) + chapterTimeOffset);
    }
  }
  document.addEventListener('fullscreenchange', applyDesktopFullscreenChrome);

  fullscreenToggleBtn.addEventListener('click', function(){
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(function(e){
        console.log('requestFullscreen failed: ' + e);
      });
    }
  });

  // Moving the mouse into the bottom 20% OR top 10% of the viewport
  // reveals chrome while fullscreen, with an inactivity timeout that
  // hides it again - matches standard fullscreen-video-player
  // conventions. The top zone also happens to be where the browser's own
  // native "press Esc to exit fullscreen" affordance shows the mouse
  // approaching - that's fine, nothing of ours renders there while
  // chrome-hidden (the top icon row is part of the same hidden set), so
  // there's no visual clash, just two independent hover reveals sharing
  // the same screen edge.
  var desktopChromeHideTimer = null;
  var DESKTOP_CHROME_HOVER_ZONE = 0.8; // bottom 20% of viewport height
  var DESKTOP_CHROME_TOP_ZONE = 0.1; // top 10% of viewport height
  var DESKTOP_CHROME_HIDE_DELAY = 2500;

  document.addEventListener('mousemove', function(e){
    if (zenCoarsePointerMql.matches) return;
    if (!document.fullscreenElement) return;
    var inBottomZone = e.clientY >= window.innerHeight * DESKTOP_CHROME_HOVER_ZONE;
    var inTopZone = e.clientY <= window.innerHeight * DESKTOP_CHROME_TOP_ZONE;
    if (!inBottomZone && !inTopZone) return;
    readerScreen.classList.remove('chrome-hidden');
    clearTimeout(desktopChromeHideTimer);
    desktopChromeHideTimer = setTimeout(function(){
      readerScreen.classList.add('chrome-hidden');
    }, DESKTOP_CHROME_HIDE_DELAY);
  });

  // Resolves the ordered side-image list for the chapter just opened -
  // see MainActivity.resolveChapterImagesJson() for the actual
  // backward-search/rotation-set logic; this just fetches and stores the
  // result. An empty list means "no images from chapter 1 up to this one"
  // - updateZenImageForTime() falls back to the existing ID3 cover art
  // in that case, same image already shown in the normal (non-zen) UI.
  async function loadZenImagesForChapter(base){
    zenImageList = [];
    zenCurrentImageUrl = null;
    try {
      var res = JSON.parse((await Android.resolveChapterImages(base)) || '{}');
      (res.images || []).forEach(function(name){
        zenImageList.push(window.chapterImageUrl(name));
      });
    } catch(e){}
  }

  // A chapter's own N images divide its duration into N equal segments,
  // switching evenly - a 1-image list (the "earlier chapter, static"
  // case from the resolution algorithm) naturally never changes segment,
  // so no special-casing is needed for it beyond the fully-empty case.
  function updateZenImageForTime(t){
    var url = null;
    if (zenImageList.length === 0) {
      url = (coverArt.style.display !== 'none' && coverArt.src) ? coverArt.src : null;
    } else if (zenImageList.length === 1) {
      url = zenImageList[0];
    } else {
      var frac = chapterDuration > 0 ? Math.min(0.999999, t / chapterDuration) : 0;
      var segment = Math.max(0, Math.min(zenImageList.length - 1, Math.floor(frac * zenImageList.length)));
      url = zenImageList[segment];
    }
    if (url && url !== zenCurrentImageUrl) {
      zenCurrentImageUrl = url;
      zenImage.src = url;
    }
    var shouldShow = zenActive && !!url;
    if (shouldShow !== (zenImageWrap.style.display === 'flex')) {
      zenImageWrap.style.display = shouldShow ? 'flex' : 'none';
      // The image's presence/absence changes how much width the text
      // gets (see getAvailableSpace()) - re-fit the current page against it.
      if (shown && idx >= 0) showPage(idx);
    }
  }

  // Recolors characters left-to-right as the chunk's own playback
  // progresses, so "10% through this chunk" reads as "10% of its
  // characters have turned" rather than a single continuous gradient -
  // matches how furigana/karaoke-style highlighting is usually done. The
  // first PRELIT_COUNT characters are lit immediately by showPage() above;
  // progress here is mapped over the remaining characters only, and
  // rescaled so the last character lands at COMPLETE_AT_FRACTION rather
  // than exactly 100% - audio for a chunk tends to actually finish a beat
  // before the chunk's own end timestamp, so waiting for true 100% often
  // meant the last couple of characters never visibly caught up.
  // Theme-dependent - see updateThemeColors()/applyTheme() below, which
  // read these from the --read-text-highlight-a/--read-text-b CSS
  // custom properties instead of hardcoding one literal color each, so
  // the light/dark theme toggle can change them without a page reload.
  var HIGHLIGHT_COLOR, FADE_BASE_COLOR;
  var PRELIT_COUNT = 2;
  var COMPLETE_AT_FRACTION = 0.95;

  // 'A' = color sweep (discrete per-character flip, the original/default
  // behavior above); 'B' = fade reveal (opacity ramps continuously per
  // character instead of the color ever changing). Global app setting,
  // not scoped per book - read once at launch, written on every toggle.
  var textPreset = 'A';
  try { textPreset = Android.getTextPreset() || 'A'; } catch(e){}

  // Sets each span's starting look for whichever preset is currently
  // active - called once per fresh chunk (showPage) and again immediately
  // on a mid-chunk preset toggle (setTextPreset below).
  function applyInitialSpanState(){
    var i;
    if (textPreset === 'B') {
      for (i = 0; i < chunkSpans.length; i++) {
        chunkSpans[i].style.color = FADE_BASE_COLOR;
        chunkSpans[i].style.opacity = (i < PRELIT_COUNT) ? '1' : '0';
      }
    } else {
      for (i = 0; i < chunkSpans.length; i++) {
        chunkSpans[i].style.opacity = '';
        chunkSpans[i].style.color = (i < chunkLitCount) ? HIGHLIGHT_COLOR : '';
      }
    }
  }

  function updateChunkHighlight(t, chunk){
    if (!shown || chunkSpans.length === 0) return;
    var span = chunk.end - chunk.start;
    var frac = span > 0 ? (t - chunk.start) / span : 1;
    frac = Math.max(0, Math.min(1, frac));
    var adjustedFrac = Math.min(1, frac / COMPLETE_AT_FRACTION);
    var remaining = Math.max(0, chunkSpans.length - PRELIT_COUNT);

    if (textPreset === 'B') {
      var continuous = adjustedFrac * remaining;
      for (var i = 0; i < remaining; i++) {
        chunkSpans[PRELIT_COUNT + i].style.opacity = Math.max(0, Math.min(1, continuous - i));
      }
      return;
    }

    var litCount = Math.min(chunkSpans.length, PRELIT_COUNT + Math.floor(adjustedFrac * remaining));
    if (litCount === chunkLitCount) return;
    var j;
    if (litCount > chunkLitCount) {
      for (j = chunkLitCount; j < litCount; j++) chunkSpans[j].style.color = HIGHLIGHT_COLOR;
    } else {
      for (j = litCount; j < chunkLitCount; j++) chunkSpans[j].style.color = '';
    }
    chunkLitCount = litCount;
  }

  function setTextPreset(preset){
    if (preset !== 'A' && preset !== 'B') return;
    textPreset = preset;
    try { Android.setTextPreset(preset); } catch(e){}
    presetToggleBtn.classList.toggle('active', preset === 'B');
    if (shown && chunkSpans.length) {
      applyInitialSpanState();
      updateChunkHighlight((audio.currentTime || 0) + chapterTimeOffset, chunks[idx]);
    }
  }

  presetToggleBtn.classList.toggle('active', textPreset === 'B');
  presetToggleBtn.addEventListener('click', function(){
    setTextPreset(textPreset === 'A' ? 'B' : 'A');
  });

  // Light/dark theme - global setting (not per-book), same persistence
  // pattern as textPreset above. Only --bg/--ink are literally specified
  // by the request; every other CSS variable is derived to stay
  // consistent, and is easy to retune independently later.
  function updateThemeColors(){
    var cs = getComputedStyle(document.documentElement);
    HIGHLIGHT_COLOR = cs.getPropertyValue('--read-text-highlight-a').trim();
    FADE_BASE_COLOR = cs.getPropertyValue('--read-text-b').trim();
  }

  var theme = 'dark';
  try { theme = localStorage.getItem('theme') || 'dark'; } catch(e){}

  function applyTheme(){
    document.documentElement.classList.toggle('light', theme === 'light');
    updateThemeColors();
    // Re-render the current chunk's colors immediately, same as
    // setTextPreset does above, rather than waiting for the next chunk.
    if (shown && chunkSpans.length) {
      applyInitialSpanState();
      updateChunkHighlight((audio.currentTime || 0) + chapterTimeOffset, chunks[idx]);
    }
  }

  applyTheme();
  themeToggleBtn.addEventListener('click', function(){
    theme = theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', theme); } catch(e){}
    applyTheme();
  });

  function currentChunkIndex(t){
    var i = 0;
    for(var k = 0; k < chunks.length; k++){
      if(chunks[k].start <= t) i = k; else break;
    }
    return i;
  }

  function renderTimeUI(t){
    elapsedLabel.textContent = formatTime(t);
    var pct = chapterDuration > 0 ? Math.max(0, Math.min(100, (t / chapterDuration) * 100)) : 0;
    progressFill.style.width = pct + '%';
    progressMarker.style.left = pct + '%';
  }

  function updateForTime(t){
    if (scrubbing) return; // don't fight the user's drag
    renderTimeUI(t);

    if(chunks.length === 0) return;
    var newIdx = currentChunkIndex(t);
    var chunk = chunks[newIdx];
    var active = t >= chunk.start && t < chunk.end;

    if(newIdx !== idx || active !== shown){
      idx = newIdx;
      shown = active;
      if(shown){
        showPage(idx);
      } else {
        blankPage();
      }
      updateChapterPill();
    }

    updateChunkHighlight(t, chunk);
    updateZenImageForTime(t);
  }

  function bufferedRangesString(){
    var s = '';
    for (var i = 0; i < audio.buffered.length; i++){
      s += '[' + audio.buffered.start(i).toFixed(2) + '-' + audio.buffered.end(i).toFixed(2) + ']';
    }
    return s || '(none)';
  }

  ['waiting','stalled','suspend','canplay','loadeddata','loadedmetadata','seeking','seeked','emptied','abort'].forEach(function(evt){
    audio.addEventListener(evt, function(){
      console.log('AUDIO ' + evt + ' t=' + audio.currentTime.toFixed(2) + ' readyState=' + audio.readyState + ' networkState=' + audio.networkState + ' buffered=' + bufferedRangesString());
    });
  });

  audio.addEventListener('error', function(){
    var err = audio.error;
    console.log('AUDIO ERROR code=' + (err ? err.code : 'null') + ' message=' + (err ? err.message : '(none)') + ' t=' + audio.currentTime.toFixed(2));
  });

  // Total chapter duration is only trustworthy from the very first,
  // untrimmed full-file load - a byte-offset "jump" resource (see
  // seekToTime) reports its own remaining length as .duration, which would
  // otherwise keep shrinking the total time shown after every seek.
  audio.addEventListener('durationchange', function(){
    if (!durationKnown && isFinite(audio.duration) && audio.duration > 0) {
      chapterDuration = audio.duration;
      durationKnown = true;
      totalLabel.textContent = formatTime(chapterDuration);
    }
  });

  // Mirrors <audio>'s state into the native MediaSession that drives the
  // lock-screen/notification controls (see PlaybackService.kt) - forced
  // (bypassing the throttle) on play/pause/speed changes so those feel
  // immediate, throttled to once per second of media time on ordinary
  // timeupdate ticks since the system interpolates the seekbar between
  // updates on its own using the reported speed.
  var lastReportedSecond = -1;
  function reportPlaybackState(force){
    var t = (audio.currentTime || 0) + chapterTimeOffset;
    var sec = Math.floor(t);
    if (!force && sec === lastReportedSecond) return;
    lastReportedSecond = sec;
    Android.reportPlaybackState(!audio.paused, t, chapterDuration, currentSpeed, pendingChapterBase);
  }

  function updatePlayPauseIcon(){
    playIcon.style.display = audio.paused ? '' : 'none';
    pauseIcon.style.display = audio.paused ? 'none' : '';
    playPauseBtn.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
  }

  audio.addEventListener('play', function(){ reportPlaybackState(true); updateChromeForPlaybackState(); updatePlayPauseIcon(); });
  audio.addEventListener('pause', function(){ reportPlaybackState(true); updateChromeForPlaybackState(); updatePlayPauseIcon(); });

  audio.addEventListener('timeupdate', function(){
    var t = audio.currentTime;
    if (isNaN(t)) {
      console.log('AUDIO timeupdate: currentTime is NaN, ignoring');
      return;
    }
    updateForTime(t + chapterTimeOffset);
    reportPlaybackState(false);
  });

  // Continuous playback: 'ended' fires once the currently loaded resource
  // reaches its own end. Every resource we ever load - the initial full
  // file, or a seekToTime() byte-offset fragment - always runs through to
  // the file's real EOF (see serveAudioFromTime), so this reliably means
  // "the chapter has actually finished," regardless of how many seeks
  // happened along the way.
  audio.addEventListener('ended', function(){
    var currentIndex = allChapters.indexOf(pendingChapterBase);
    if (currentIndex >= 0 && currentIndex + 1 < allChapters.length) {
      openChapter(allChapters[currentIndex + 1]);
    }
  });

  function togglePlayPause(){
    if(audio.paused) audio.play(); else audio.pause();
  }

  // A tiny forward nudge past the exact chunk boundary, same reasoning as
  // before: landing a hair before the intended start (rounding/frame
  // snapping) reads as still-the-previous-chunk or as silence.
  var SEEK_EPSILON = 0.05;

  // Unlike the Android app (whose SAF+WebView combination couldn't
  // reposition an already-loaded <audio> resource reliably, hence that
  // app's virtual-byte-offset "fake seek" - see the Android asset's own
  // index.html for that history), a real Range-serving HTTP file server
  // needs none of that: plain currentTime assignment against this
  // server's /audio endpoint seeks correctly on its own (confirmed via
  // the Phase 2 Range-serving verification), so chapterTimeOffset simply
  // never needs to move away from 0 in this build.
  function seekToTime(targetTime){
    if (chapterDuration > 0) targetTime = Math.max(0, Math.min(targetTime, chapterDuration));
    else targetTime = Math.max(0, targetTime);
    var wasPlaying = !audio.paused;
    audio.currentTime = targetTime;
    if (wasPlaying) audio.play();
    updateForTime(targetTime);
  }

  function seekToChunk(target){
    target = Math.max(0, Math.min(chunks.length - 1, target));
    seekToTime(chunks[target].start + SEEK_EPSILON);
  }

  function goNext(){ if (chunks.length) seekToChunk(idx + 1); }
  function goPrev(){ if (chunks.length) seekToChunk(Math.max(0, idx - 1)); }

  // Player-controls row - reuses the exact same actions as the existing
  // edge-swipe gestures (goPrev/goNext) and triple-tap-adjacent transport
  // functions, just as visible buttons.
  prevChapterBtn.addEventListener('click', goPrevChapter);
  prevPartBtn.addEventListener('click', goPrev);
  playPauseBtn.addEventListener('click', togglePlayPause);
  nextPartBtn.addEventListener('click', goNext);
  nextChapterBtn.addEventListener('click', goNextChapter);

  // Entry points for transport actions arriving from outside the WebView -
  // the lock-screen widget, the notification, Bluetooth headset buttons,
  // Android Auto - relayed here from PlaybackService via MainActivity's
  // TransportListener (see runJs() in MainActivity.kt).
  window.mediaPlay = function(){ audio.play().catch(function(e){ console.log('mediaPlay failed: ' + e); }); };
  window.mediaPause = function(){ audio.pause(); };
  window.mediaNext = function(){ goNext(); };
  window.mediaPrevious = function(){ goPrev(); };
  window.mediaSeekTo = function(seconds){ seekToTime(seconds); };

  // --- Gestures on the text area: tap to play/pause, triple-tap to go
  // back to the library, edge-swipe to prev/next. All funneled through
  // Pointer Events so mouse (desktop testing) and touch behave the same.
  var EDGE_ZONE = 32;
  var SWIPE_MIN_DX = 48;
  var TAP_MAX_MOVE = 12;
  var TAP_GAP_MS = 300;
  // Deliberately a bit harder to trigger than a page-turn swipe, since it
  // has a lasting effect (creates a bookmark) rather than just moving a
  // page forward/back.
  var VSWIPE_MIN_DY = 64;

  var pointerStart = null;
  var tapCount = 0;
  var tapTimer = null;

  function registerTap(){
    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){
      if (tapCount === 1) {
        togglePlayPause();
      } else if (tapCount >= 3) {
        goToLibrary();
      }
      tapCount = 0;
    }, TAP_GAP_MS);
  }

  frame.addEventListener('pointerdown', function(e){
    pointerStart = { x: e.clientX, y: e.clientY };
  });

  frame.addEventListener('pointerup', function(e){
    if (!pointerStart) return;
    var dx = e.clientX - pointerStart.x;
    var dy = e.clientY - pointerStart.y;
    var rect = frame.getBoundingClientRect();
    var startedNearLeft = (pointerStart.x - rect.left) <= EDGE_ZONE;
    var startedNearRight = (rect.right - pointerStart.x) <= EDGE_ZONE;
    var horizontal = Math.abs(dx) > Math.abs(dy);
    pointerStart = null;

    if (horizontal && dx >= SWIPE_MIN_DX && startedNearLeft) {
      goNext();
    } else if (horizontal && -dx >= SWIPE_MIN_DX && startedNearRight) {
      goPrev();
    } else if (!horizontal && -dy >= VSWIPE_MIN_DY) {
      saveBookmarkGesture();
    } else if (Math.abs(dx) < TAP_MAX_MOVE && Math.abs(dy) < TAP_MAX_MOVE) {
      registerTap();
    }
  });

  // Swipe up (anywhere on the text area, not edge-gated) to bookmark the
  // current chapter+time. Auto-labeled by date/time on the native side
  // (MainActivity.saveBookmarkRecord) - see the library screen's
  // Bookmarks section for viewing/deleting them.
  async function saveBookmarkGesture(){
    if (!pendingChapterBase) return;
    var t = (audio.currentTime || 0) + chapterTimeOffset;
    var json;
    try { json = JSON.parse(await Android.saveBookmark(pendingChapterBase, t)); } catch(e){ json = null; }
    if (json && !json.error) {
      showBookmarkToast(json.label);
    }
  }

  var bookmarkToastTimer = null;
  function showBookmarkToast(text){
    bookmarkToast.textContent = text;
    bookmarkToast.classList.add('show');
    if (bookmarkToastTimer) clearTimeout(bookmarkToastTimer);
    bookmarkToastTimer = setTimeout(function(){ bookmarkToast.classList.remove('show'); }, 1600);
  }

  // --- Drag-to-seek on the progress track.
  function scrubTargetFromEvent(e){
    var rect = progressTrack.getBoundingClientRect();
    var frac = (e.clientX - rect.left) / rect.width;
    frac = Math.max(0, Math.min(1, frac));
    return frac * (chapterDuration || 0);
  }

  progressTrack.addEventListener('pointerdown', function(e){
    scrubbing = true;
    try { progressTrack.setPointerCapture(e.pointerId); } catch(err){}
    renderTimeUI(scrubTargetFromEvent(e));
  });
  progressTrack.addEventListener('pointermove', function(e){
    if (scrubbing) renderTimeUI(scrubTargetFromEvent(e));
  });
  progressTrack.addEventListener('pointerup', function(e){
    if (!scrubbing) return;
    scrubbing = false;
    seekToTime(scrubTargetFromEvent(e));
  });

  // --- Speed control overlay.
  function setSpeed(v){
    if (!isFinite(v)) return;
    v = Math.max(0.25, Math.min(8, Math.round(v * 100) / 100));
    currentSpeed = v;
    audio.playbackRate = v;
    speedLabel.textContent = v.toFixed(2) + 'x';
    speedValue.textContent = v.toFixed(2) + 'x';
    speedSlider.value = v;
    reportPlaybackState(true);
  }

  // Visible second entry point for the same two actions the existing
  // gestures already do (triple-tap / swipe-up) - matches the Windows
  // sibling app's icon row. Gestures keep working unchanged.
  libraryBtn.addEventListener('click', goToLibrary);
  bookmarkBtn.addEventListener('click', saveBookmarkGesture);

  speedPill.addEventListener('click', function(){
    speedOverlay.style.display = (speedOverlay.style.display === 'flex') ? 'none' : 'flex';
  });
  speedOverlay.addEventListener('click', function(e){
    if (e.target === speedOverlay) speedOverlay.style.display = 'none';
  });
  speedDown.addEventListener('click', function(){ setSpeed(currentSpeed - 0.01); });
  speedUp.addEventListener('click', function(){ setSpeed(currentSpeed + 0.01); });
  speedSlider.addEventListener('input', function(){ setSpeed(parseFloat(speedSlider.value)); });
  Array.prototype.forEach.call(document.querySelectorAll('#speedPresets button'), function(btn){
    btn.addEventListener('click', function(){ setSpeed(parseFloat(btn.getAttribute('data-speed'))); });
  });

  // --- Volume control: clicking #volumeToggleBtn opens a stack of four
  // pills below it (+ / level / - / mute), all plain default-styled
  // .iconBtn pills - closing is only ever done by clicking the volume
  // icon again (not click-outside, not tab-hidden - unlike the discarded
  // capsule design, this one's explicitly icon-toggled both ways), or
  // immediately by the mute button itself (see below). Level is an
  // integer 0-100 in steps of 5; holding + or - repeats (an initial
  // delay before the first repeat, then a faster steady interval).
  var VOLUME_STEP = 5;
  var volumeLevel = Math.round((audio.volume || 1) * 100 / VOLUME_STEP) * VOLUME_STEP;
  var muted = false;
  var volumeBeforeMute = volumeLevel;

  function renderVolumeLevel(){
    volumeLevelPill.textContent = volumeLevel;
    audio.volume = volumeLevel / 100;
  }
  renderVolumeLevel(); // audio.volume defaults to 1 - sync the pill up front

  function setVolumeLevel(v){
    volumeLevel = Math.max(0, Math.min(100, v));
    renderVolumeLevel();
  }

  function setMuted(v){
    muted = v;
    volumeIconNormal.style.display = muted ? 'none' : '';
    volumeIconMuted.style.display = muted ? '' : 'none';
  }

  volumeToggleBtn.addEventListener('click', function(e){
    e.stopPropagation();
    volumePopup.classList.toggle('show');
  });

  var VOLUME_REPEAT_DELAY = 400;
  var VOLUME_REPEAT_INTERVAL = 120;
  var volumeRepeatTimer = null;

  function startVolumeRepeat(step){
    // Raising volume while muted is a second, implicit way to unmute
    // (besides the mute button itself) - continues from 0 rather than
    // restoring volumeBeforeMute, per the "+ increases from 0 to 5"
    // request. Only relevant for the "+" direction; "-" while muted just
    // clamps at 0 same as always, no special-casing needed there.
    if (step > 0 && muted) setMuted(false);
    setVolumeLevel(volumeLevel + step);
    volumeRepeatTimer = setTimeout(function repeat(){
      setVolumeLevel(volumeLevel + step);
      volumeRepeatTimer = setTimeout(repeat, VOLUME_REPEAT_INTERVAL);
    }, VOLUME_REPEAT_DELAY);
  }
  function stopVolumeRepeat(){
    clearTimeout(volumeRepeatTimer);
    volumeRepeatTimer = null;
  }
  volumeUpBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startVolumeRepeat(VOLUME_STEP); });
  volumeDownBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startVolumeRepeat(-VOLUME_STEP); });
  // On window, not the buttons themselves, so releasing after the
  // pointer has dragged off the button (still held) reliably stops it.
  window.addEventListener('pointerup', stopVolumeRepeat);
  window.addEventListener('pointercancel', stopVolumeRepeat);

  // Mute toggle: saves the current level before muting (so unmuting via
  // this same button restores it), always closes the whole popup
  // immediately regardless of which direction it just toggled - matches
  // the request that clicking mute "immediately hides" all four pills,
  // not just the other three.
  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (muted) {
      setMuted(false);
      setVolumeLevel(volumeBeforeMute);
    } else {
      volumeBeforeMute = volumeLevel;
      setMuted(true);
      setVolumeLevel(0);
    }
    volumePopup.classList.remove('show');
  });

  renderHome();
})();
</script>
</body>
</html>
