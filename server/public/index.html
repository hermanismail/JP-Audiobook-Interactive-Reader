<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<!-- Lets "Add to Home Screen" launch this as a standalone, chrome-free
     web app on iOS/iPadOS regardless of Safari version - a more reliable
     fullscreen path than depending on requestFullscreen() succeeding
     (only supported for non-video elements since iOS/iPadOS 26). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Roboto for the home screen's title/subtitle - Google Fonts, since
     there's no reliable guarantee a system actually has a font literally
     named "Roboto Black" installed. 300 for #homeSubtitle (same family
     as the title, just its existing Light weight), 700 for #homeTitle
     (bold, but a step down from the Black/900 cut - see the weight note
     on #homeTitle below). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
<title>JP Audiobook Player</title>
<style>
  /* Theme: dark (default) / light, toggled via a .light class on <html>
     by #themeToggleBtn below. Only two colors are actually specified by
     the request (background #e5decf, black ink) - everything else here
     (panel backgrounds, borders, muted text) is a proportionate design
     fill-in derived from the dark theme's existing relationships, open
     to adjustment. --accent stays identical in both themes (already
     reads fine against both a near-black and a light-beige background).
     --read-text-base is deliberately close in both themes (pre-highlighted
     text stays a light grey either way) - tuned to #d0d0d0 in light mode
     after #d6d6d6 read too low-contrast against #e5decf during review. */
  :root {
    --bg:#0b0b0d; --ink:#e8e6ea; --panel-bg:#17161a; --panel-bg-2:#1c1a20;
    --border:#3a3840; --muted:#9b93b0; --muted2:#9a97a0; --placeholder-ink:#4a4650;
    --accent:#e08a3c; --progress-track:#2a2830; --control-btn-bg:#26232b;
    --timerow-ink:#c9c6cf;
    --read-text-base:#d6d6d6; --read-text-highlight-a:#F6CAC0; --read-text-b:#d6d6d6;
    --book-pill-ink:#d6d6d6;
    --zen-overlay-bg:rgba(23,22,26,0.82);
    --preset-active-border:#d6d6d6;
  }
  :root.light {
    --bg:#e5decf; --ink:#000000; --panel-bg:#ddd3bd; --panel-bg-2:#efe8d8;
    --border:#b8ab8e; --muted:#7a6f58; --muted2:#8a7f68; --placeholder-ink:#a89a7d;
    --accent:#e08a3c; --progress-track:#cfc3a8; --control-btn-bg:#e5dcc4;
    --timerow-ink:#4a4030;
    --read-text-base:#d0d0d0; --read-text-highlight-a:#000000; --read-text-b:#000000;
    --book-pill-ink:#000000;
    --zen-overlay-bg:rgba(221,211,189,0.88);
    --preset-active-border:#000000;
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: sans-serif; overflow:hidden; }

  /* Home screen: pill grid of every configured book - the app's actual
     entry point now. Clicking a pill goes to the usual per-book library
     view (#libraryScreen) below; nothing here talks to Android.* beyond
     listBooks()/selectBook(), which only exist in this web build's own
     bridge-shim.js (no Android equivalent - the native app only ever has
     one SAF folder open at a time). */
  #homeScreen { padding:24px; box-sizing:border-box; height:100%; overflow-y:auto; }
  #homeHeader {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px 16px 0; text-align:center;
  }
  #homeTitle, #homeSubtitle {
    color:var(--ink); margin:0;
    font-family:"Roboto","Arial",sans-serif;
  }
  #homeSubtitle { font-size:28px; font-weight:300; }
  /* First letter of each word bolded - S/H/A/M/A spells out the title
     above ("SHAMA"), same trick a lot of acronym-derived names use. */
  .subtitleInitial { font-weight:700; }
  /* Reference design gave a flat 10em/letter-spacing:0.2em/margin-bottom:
     -50px - reproduced here, adapted to fit the rest of the page (rem
     instead of em so it doesn't compound off a parent font-size, a
     Google-Fonts-loaded weight so "Black" actually renders instead of
     silently falling back to regular, and margin-bottom in em so the
     tight title/subtitle coupling scales proportionally with whatever
     the fluid font-size below computes rather than a fixed px gap that
     would look wrong once the title's shrunk on a small screen).
     Sizing: flat at 10rem for any viewport >=800px (so it never grows
     bigger past 1440px either - already flat well before that point),
     fluidly shrinking down to a 3rem floor as width drops from 800 to
     400px, then flat again below 400px. The clamp()'s own min/max do
     the "stop growing/start shrinking at these edges" work - the middle
     calc() is just a linear interpolation between the two anchor points
     (400px->3rem, 800px->10rem); outside [400,800] the outer clamp
     bounds simply win over whatever the formula would otherwise compute. */
  #homeTitle {
    font-weight:700;
    letter-spacing:0.2em;
    font-size:clamp(3rem, calc(3rem + (10rem - 3rem) * ((100vw - 400px) / (800px - 400px))), 10rem);
    margin-bottom:-0.3em;
    /* letter-spacing adds its gap AFTER every character, including the
       last one - so the rendered box is wider on the right than the left
       (no matching gap before the first character), and text-align/
       flex-centering centers that lopsided BOX, not the glyphs
       themselves, visibly skewing the word left of true center at this
       size (0.2em is ~large in absolute px once font-size is 100px+).
       Negative margin-right equal to the letter-spacing value cancels
       just that trailing gap so the centered box's true center lines up
       with the glyphs' visual center instead. */
    margin-right:-0.2em;
  }
  #homeGrid {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    align-content:flex-start; gap:50px; padding:36px 16px; box-sizing:border-box;
  }
  .bookPill {
    width:400px; height:400px; box-sizing:border-box;
    border:2px solid var(--muted2); border-radius:28px; background:var(--panel-bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:16px; cursor:pointer;
  }
  .bookPill.current { border-color:var(--accent); }
  .bookCover, .bookCoverPlaceholder {
    width:300px; height:300px; border-radius:12px; object-fit:cover;
    background:var(--panel-bg-2); flex-shrink:0;
  }
  .bookCoverPlaceholder { display:flex; align-items:center; justify-content:center; color:var(--placeholder-ink); font-size:48px; }
  .bookTitle, .bookAuthor {
    font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif;
    color:var(--book-pill-ink); text-align:center; width:100%; flex-shrink:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .bookTitle { font-size:18px; font-weight:600; line-height:1.3; }
  .bookAuthor { font-size:16px; line-height:1.3; }

  /* flex column + align-items:center centers both direct children (the
     home button and #libraryBody) as a group, so the button sits above
     the two-column content instead of pinned to the far left on a wide
     screen. */
  #libraryScreen { display:none; flex-direction:column; align-items:center; padding:24px; box-sizing:border-box; height:100%; overflow-y:auto; }
  #libraryScreen h1 { display:none; } /* left column's own title/author pill covers this now */
  #chooseFolderBtn { display:block; width:100%; max-width:400px; box-sizing:border-box; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border); background:var(--panel-bg); color:var(--ink); font-size:15px; }

  /* Home icon pill - replaces the old "← All books" text link, now a
     circular icon button matching the reader screen's .iconBtn visual
     language (border/bg/currentColor icon), centered above the content
     rather than pinned to the top-left corner. */
  #allBooksBtn {
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width:50px; height:50px; border-radius:50%; padding:0; margin:0 0 24px; cursor:pointer;
    border:1px solid var(--border); background:var(--panel-bg); color:var(--ink);
  }

  /* Two-column library layout: left = book cover/title/author (reuses
     .bookPill from the home screen, exact 400x400 at >=800px container
     width); right = chapter pills + bookmarks. Both columns centered as
     a pair with a fixed 50px gap - see the 800px media query below for
     the narrow-screen single-column fallback. */
  #libraryBody { display:flex; flex-wrap:nowrap; justify-content:center; align-items:flex-start; gap:50px; }
  /* Album art pill + Continue (if any), stacked as one unit so Continue
     always sits directly under the art regardless of breakpoint - see
     the 800px media query below, which only changes whether this whole
     wrapper sits beside or above the right column, never Continue's
     position relative to the art pill itself. */
  #libraryLeftColWrap { display:flex; flex-direction:column; align-items:center; gap:12px; flex-shrink:0; }
  .libraryBookPill { flex-shrink:0; cursor:default; }
  #libraryRightCol { width:400px; flex-shrink:0; display:flex; flex-direction:column; gap:20px; }

  /* Chapter/bookmark pills: fixed 35px height, full (flexible/fluid, not
     a hardcoded literal px) width of their column by default - one pill
     per row, Continue then Chapter 1, 2, 3... in reading order. See
     renderLibrary() in the script: if that single column's *measured*
     height exceeds 400px (matching the left column's own height), it's
     rebuilt as two explicit side-by-side .pillWrap sub-columns
     (.twoColRow) - left gets as many chapters, in order, as fit in
     400px; Continue plus whatever's left goes in the right sub-column,
     which is allowed to grow past 400px if even that overflows -
     deliberately NOT left to flex-wrap's own row-major wrapping, which
     would interleave Continue/Chapter 1 on row one, Chapter 2/3 on row
     two, etc. instead of filling the left column with 1, 2, 3... first. */
  .pillWrap { display:flex; flex-direction:column; gap:8px; width:100%; }
  .chapterPill {
    height:35px; width:100%; max-width:400px; box-sizing:border-box; padding:0 16px;
    border-radius:999px; border:1px solid var(--border); background:var(--panel-bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .chapterPill.continuePill { border-color:var(--accent); color:var(--accent); }
  .twoColRow { display:flex; gap:8px; width:408px; align-items:flex-start; } /* 2 x 200px + 8px gap */
  .twoColRow .pillWrap { width:200px; flex-shrink:0; }

  .sectionLabel { color:var(--muted2); font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:0.04em; }
  #emptyMsg { color:var(--muted2); font-size:14px; margin-bottom:16px; }

  /* Bookmark pills reuse .chapterPill's sizing but need room for the
     swipe-reveal delete button behind them, so each gets its own
     positioned wrapper instead of sitting directly in the flex-wrap
     (same swipe mechanic as before, just resized to the 35px pill). */
  .bookmarkWrap { position:relative; overflow:hidden; border-radius:999px; height:35px; width:100%; max-width:400px; }
  .bookmarkWrap .chapterPill { position:relative; z-index:1; width:100%; height:100%; justify-content:flex-start; }
  .bookmarkDelete { position:absolute; top:0; right:0; bottom:0; width:72px; border:none; border-radius:0 999px 999px 0;
    background:#7a3030; color:#fff; font-size:13px; }

  @media (max-width:799px) {
    #libraryBody { flex-direction:column; align-items:center; }
    .libraryBookPill { width:min(400px, 90vw); height:min(400px, 90vw); }
    #libraryRightCol { width:100%; max-width:400px; }
    /* Not enough width for two 200px sub-columns side by side on a
       narrow screen - stack them instead (left sub-column's chapters,
       then the right sub-column's Continue+remainder, both full width). */
    .twoColRow { flex-direction:column; width:100%; }
    .twoColRow .pillWrap { width:100%; }
  }

  #readerScreen { display:none; position:relative; height:100%; box-sizing:border-box; flex-direction:column; padding:16px; gap:10px; touch-action:none; }

  #readerTopBar { position:absolute; top:16px; left:16px; z-index:5; display:flex; gap:8px; }
  /* box-sizing explicit (not just relying on <button>'s default UA
     border-box) since #volumeLevelPill reuses this class on a plain
     <div> - content-box's default would let that one element's border
     add ~2px on top of the declared 36px, throwing off alignment against
     its <button> siblings in the volume stack. */
  .iconBtn { box-sizing:border-box; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--panel-bg); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:0; }
  .iconBtn:disabled { opacity:0.35; cursor:default; }

  /* Player controls row (prev chapter / prev part / play-pause / next
     part / next chapter) - same .iconBtn circles as the top bar, living
     inside #metaRow itself (see the grid rule below) as the middle column
     between the cover/title/author info on the left and the chapter/speed
     pills on the right, rather than a separate row of its own. Grid gives
     this column `justify-self:stretch` by default, so #playerControls'
     own box always spans the *entire* leftover gap between those two
     blocks - centering the button group inside that box (justify-content
     below) is therefore always a true center between the two info blocks,
     not just the middle of the whole row, and vertically it's centered
     against them via #metaRow's own `align-items:center`. */
  #playerControls { display:flex; justify-content:center; align-items:center; gap:20px; min-width:0; }

  /* Responsive collapse: chapter-skip buttons go first (bigger jumps,
     less essential at a glance), then part-skip, leaving just
     play/pause at the narrowest widths. Which class(es) are applied is
     computed by updatePlayerControlsFit() from the row's actual measured
     width vs. the container's available width - not a hardcoded viewport
     breakpoint, since padding/container width is what actually determines
     whether the row fits, not the raw window width. */
  #playerControls.hide-chapter #prevChapterBtn,
  #playerControls.hide-chapter #nextChapterBtn { display:none; }
  #playerControls.hide-part #prevPartBtn,
  #playerControls.hide-part #nextPartBtn { display:none; }
  /* Same protected top zone as #readerTopBar (#frame's 64px top padding
     below runs the full width of the frame, not just under the left
     icons) - just anchored to the right edge instead. Slot order,
     nearest the edge first: volume (16), preset (60), theme (104),
     fullscreen/force-zen (148) - each 44px apart (36px icon + 8px gap). */
  #volumeToggleBtn { position:absolute; top:16px; right:16px; z-index:5; }
  #presetToggleBtn { position:absolute; top:16px; right:60px; z-index:5; font-size:16px; font-weight:500; }
  /* Fade preset (B) only changes the pill's outline, not the あ glyph
     itself - light grey in dark mode, black ink in light mode (both via
     --preset-active-border, so the icon's own currentColor stays --ink
     unlike #forceZenBtn.active, which intentionally uses --accent). */
  #presetToggleBtn.active { border-color:var(--preset-active-border); }
  /* icon color/border inverts for free via .iconBtn's color:var(--ink)
     and the SVG's stroke="currentColor", same mechanism as every other
     icon button here; no separate light/dark icon asset needed. */
  #themeToggleBtn { position:absolute; top:16px; right:104px; z-index:5; }
  /* #fullscreenToggleBtn (desktop: real requestFullscreen(), since F11
     itself is invisible to JS - see applyDesktopFullscreenChrome() in
     the script) and #forceZenBtn (touch: manually engage zen for
     rotation-locked users) share this one position, since exactly one
     of them is ever relevant per device - gated by (pointer: coarse/
     fine) below, not JS, since pointer type doesn't change at runtime. */
  #fullscreenToggleBtn, #forceZenBtn { position:absolute; top:16px; right:148px; z-index:5; }
  #forceZenBtn.active { border-color:var(--accent); color:var(--accent); }
  @media (pointer: coarse) { #fullscreenToggleBtn { display:none; } }
  @media (pointer: fine) { #forceZenBtn { display:none; } }

  /* Volume control: a small stack of four pills (+ / level / - / mute)
     drops down below the volume icon, all the same 36px .iconBtn size
     and right-aligned flush with it (so they line up in one column) -
     10px gap from the icon and between each pill. All four keep the
     plain default .iconBtn look (border:var(--border)/
     background:var(--panel-bg)/color:var(--ink)) - no special accent/
     active color scheme, just whatever the current dark/light theme
     already gives every other icon button for free. */
  #volumePopup {
    display:none; flex-direction:column; gap:10px;
    position:absolute; top:62px; right:16px; z-index:5;
  }
  #volumePopup.show { display:flex; }
  #volumeLevelPill { font-size:13px; font-weight:600; cursor:default; }

  /* Extra top padding (vs 26px on the other three sides) clears
     #readerTopBar/#presetToggleBtn's icon buttons (top:16px + 36px tall =
     52px from the screen edge, plus a little breathing room) - otherwise
     the top-most column of vertical text would render right underneath
     them. Keep in sync with PAD_TOP/PAD_X in the script below, which need
     the same numbers for the text-fit math. Drops to 2vh/26px in zen mode
     (see the .zen rule further down), since there are no icons left to
     clear once they're hidden. */
  #frame { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; padding:64px 26px 26px; box-sizing:border-box; }
  #pageText { writing-mode:vertical-rl; height:100%; letter-spacing:0.06em; font-weight:500; transition:opacity 0.3s; opacity:1; color:var(--read-text-base); font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif; overflow-wrap:anywhere; }
  #pageText span { transition:color 0.2s ease, opacity 0.15s linear; }
  #measure { position:absolute; visibility:hidden; top:-9999px; left:-9999px; writing-mode:vertical-rl; letter-spacing:0.06em; font-weight:500; font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif; white-space:normal; overflow-wrap:anywhere; }
  #loadingOverlay { display:none; color:var(--muted); font-size:14px; text-align:center; }

  /* Chrome (icon row + progress/info rows) visibility is decoupled from
     .zen (the side-image content layout) - see applyZenState()/
     fullscreenchange handling in the script. Mobile/tablet sets both
     together on rotation (then toggles this one on pause/play); desktop
     sets this independently of .zen, driven by real browser fullscreen
     (F11), not width. */
  #readerScreen.chrome-hidden #readerTopBar,
  #readerScreen.chrome-hidden #presetToggleBtn,
  #readerScreen.chrome-hidden #themeToggleBtn,
  #readerScreen.chrome-hidden #fullscreenToggleBtn,
  #readerScreen.chrome-hidden #forceZenBtn,
  #readerScreen.chrome-hidden #volumeToggleBtn,
  #readerScreen.chrome-hidden #volumePopup { display:none; }
  /* !important, not another specificity bump: #zenChromeOverlay's own
     "when to overlay" rule (further down) has grown multiple selectors
     of varying, sometimes-equal specificity (.zen:not(.desktop) and
     .zen.desktop.fullscreen both reduce to 2 classes, tying a plain
     2-class hide selector and making the later-in-file rule win instead
     of whichever is actually true) - chasing that with an ever-more­
     specific hide selector for every new show condition doesn't scale.
     chrome-hidden should unconditionally hide this regardless of *why*
     the overlay would otherwise show, so it gets the one-shot fix
     instead of another selector-specificity arms race. */
  #readerScreen.chrome-hidden #zenChromeOverlay { display:none !important; }

  /* Zen mode: distraction-free side-image layout. Two independent
     triggers set the shared .zen class - mobile/tablet via physical
     rotation (zenMql/zenCoarsePointerMql below), desktop via window
     width alone (>=800px, see applyZenState()) - the .desktop modifier
     distinguishes which sub-case is active for the CSS below, since
     they want different padding/anchoring. */
  /* Top/bottom padding is 1vh each (1% of screen height) - now that zen
     mode also hides the status/nav bars (see Android.setImmersiveMode),
     a true zero here put text/image flush against the physical screen
     edge, which read as too tight. Right padding is 2vw (image's own
     buffer from the true right screen edge); left stays 1vw (text's
     buffer from the true left screen edge, unchanged). The flex gap
     (text-to-image spacing) is 2vw, up from the previous 1vw - all four
     numbers kept in sync with ZEN_TOP_BOTTOM_FRACTION/
     ZEN_RIGHT_FRACTION/ZEN_LEFT_FRACTION/ZEN_GAP_FRACTION in the script
     below. Mobile/tablet only - see .zen.desktop below for the
     desktop-specific override. */
  #readerScreen.zen #frame { padding:1vh 2vw 1vh 1vw; gap:2vw; }

  /* Right-anchored, not centered: switches #frame's justify-content from
     the normal mode's center to flex-end, so the [text, image] pair packs
     against the right edge and any leftover width collects on the left -
     the natural side for right-to-left vertical Japanese text, rather
     than splitting evenly on both sides regardless of the image's aspect
     ratio. #zenImageWrap is #pageText's sibling, appearing after it in
     DOM order, so it's the one flex-end actually pins to the right - see
     the JS comment on getAvailableSpace() for why the image (not the
     text) is the fixed point chunk-to-chunk. Mobile/tablet only. */
  #readerScreen.zen #frame { justify-content:flex-end; }

  /* Desktop zen (window width >= 800px, non-touch): right-anchored,
     same as mobile/tablet - a centered pair was tried first, but
     #pageText's *actual* rendered width varies chunk-to-chunk (fitting
     text is quantized into discrete vertical columns, so it rarely
     fills its full column budget exactly - see recalcZenColumns() -
     and drops to ~0 during a silent gap between chunks, when
     blankPage() empties it out). Since centering packs and centers the
     [text, image] row as a unit, that varying width made the whole row
     - image included - visibly shift left/right, which was the actual
     complaint (not just per-image-swap resizing, already fixed
     separately by the fixed column widths). flex-end pins the image's
     right edge to a constant position regardless of the text's actual
     width, exactly like mobile/tablet already does - only the leftover
     space (which nothing occupies) changes size. Keeps its own
     symmetric padding scheme, though - just the anchoring changed. */
  #readerScreen.zen.desktop #frame { padding:3vh 3vw; gap:2vw; justify-content:flex-end; }

  /* Chrome-as-overlay in zen mode: #zenChromeOverlay wraps #timeRow/
     #progressTrack/#metaRow. Outside zen it's `display:contents` - inert,
     the three rows stay direct flex children of #readerScreen exactly as
     before (same gap, same flow). In zen, it becomes a positioned flex
     column floating over #frame instead of a sibling that reserves its
     own flow height - so #frame (flex:1) always fills the *entire*
     available box regardless of whether chrome is shown or hidden, and
     revealing/hiding it (pause/play on mobile, hover on desktop
     fullscreen) never resizes or reflows the zen image/text columns
     underneath. Real user report before this fix: chrome reappearing
     visibly "pushed" the zen layout upward as #frame shrank to make room
     for it in the normal flex flow. The translucent background (blurred,
     theme-aware via --zen-overlay-bg) keeps it legible over whatever
     image/text happens to be under it, since it's no longer sitting on
     the plain screen background.
     Scoped to only the cases where chrome actually toggles, though:
     mobile/tablet zen (`.zen:not(.desktop)`, always toggles via
     pause/play) and desktop zen while genuinely fullscreen
     (`.zen.desktop.fullscreen`, `.fullscreen` set by
     applyDesktopFullscreenChrome() from document.fullscreenElement).
     Desktop zen in a normal (non-fullscreen) window never toggles chrome
     at all - it's always visible there - so overlaying it would only
     make it float oddly over the bottom of the image/text for no
     reason; real user report confirmed this looked wrong. Left out of
     the selector below, `#zenChromeOverlay` falls through to the plain
     `display:contents` rule for that combination, i.e. back to sitting
     in normal flow under #frame exactly like it did before this feature
     existed. */
  #zenChromeOverlay { display:contents; }
  #readerScreen.zen:not(.desktop) #zenChromeOverlay,
  #readerScreen.zen.desktop.fullscreen #zenChromeOverlay {
    display:flex; flex-direction:column; gap:10px;
    position:absolute; left:16px; right:16px; bottom:16px; z-index:6;
    background:var(--zen-overlay-bg); border-radius:16px; padding:12px 16px;
    box-sizing:border-box; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }

  /* Width is set explicitly from JS (recalcZenColumns()) to a cached,
     evenly-split value - flex-shrink:0 keeps flexbox from ever
     overriding it, so this box's size only ever changes on a genuine
     resize/fullscreen-toggle recalculation, never per-chunk or when a
     different side image (different aspect ratio) rotates in. */
  #zenImageWrap { display:none; align-items:center; flex-shrink:0; }
  #zenImage {
    /* object-fit:contain (not width:auto) - the image scales to fit
       inside this now-fixed-width box, whatever its own aspect ratio,
       rather than the image's aspect ratio dictating the box's width -
       this is what stops the image (and consequently the text column
       next to it) from visibly resizing/repositioning every time a
       differently-shaped image rotates in. */
    height:100%; width:100%; object-fit:contain; border-radius:8px;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-composite: source-in;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    mask-composite: intersect;
    mask-repeat: no-repeat;
    mask-size: 100% 100%;
  }

  #bookmarkToast { position:fixed; left:50%; top:16px; transform:translateX(-50%);
    background:var(--panel-bg); border:1px solid var(--border); color:var(--ink); padding:8px 16px;
    border-radius:999px; font-size:13px; opacity:0; transition:opacity 0.3s;
    pointer-events:none; z-index:20; white-space:nowrap; }
  #bookmarkToast.show { opacity:1; }

  #timeRow { display:flex; justify-content:space-between; font-size:12px; color:var(--timerow-ink); padding:0 2px; }

  #progressTrack { position:relative; height:22px; display:flex; align-items:center; }
  #progressTrackLine { position:relative; width:100%; height:3px; background:var(--progress-track); border-radius:2px; overflow:visible; }
  #progressFill { position:absolute; left:0; top:0; height:100%; width:0%; background:var(--accent); border-radius:2px; }
  #progressMarker { position:absolute; top:50%; left:0%; width:12px; height:12px; margin-left:-6px; margin-top:-6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 6px rgba(224,138,60,0.15); }

  /* Three-column grid, not a plain flex row: the outer two columns
     (left info block, right pill column) size to their own content, and
     the middle column - #playerControls - always gets whatever's left
     over, which is exactly "centered between them" per the user's
     mockup. align-items:center vertically centers all three columns
     against the row's own height (driven by the 56px cover art), so
     the button row is always middle-aligned with both info blocks too.
     The middle column's minmax(36px, ...) floor (real bug, found via
     testing at phone width with a long chapter/part pill string): with a
     bare 1fr, grid happily lets the left column shrink only as far as
     needed to fit the left+right columns' own content, then hands the
     middle column whatever's left - which can be 0 when the outer two
     alone already exceed the row's width, leaving the play/pause button
     rendered with no box to center in and visually overlapping the pill
     column next to it instead of looking "not centered." Reserving 36px
     (one icon button) forces the left column to keep shrinking past that
     point instead, since it's the only track with real give left (right
     column's pill text is nowrap, effectively unshrinkable). */
  #metaRow { display:grid; grid-template-columns: minmax(0, 220px) minmax(36px, 1fr) auto; align-items:center; gap:12px; }
  #metaLeftInfo { display:flex; align-items:center; gap:12px; min-width:0; }
  #coverArt, #coverPlaceholder { width:56px; height:56px; border-radius:6px; flex-shrink:0; object-fit:cover; background:var(--panel-bg-2); border:1px solid var(--border); }
  #coverPlaceholder { display:flex; align-items:center; justify-content:center; color:var(--placeholder-ink); font-size:22px; }

  #metaTextCol { min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  #chapterTitle { min-width:0; font-size:16px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .marqueeBox { min-width:0; overflow:hidden; white-space:nowrap; font-size:12px; color:var(--muted); }
  .marqueeBox .marqueeInner { display:inline-flex; }
  .marqueeBox .marqueeGap { display:inline-block; width:36px; flex-shrink:0; }

  /* Right column: chapter/speed pills, now stacked on their own (no
     longer paired one-per-line with the title/author text) so the
     middle column above has a real right edge to center against.
     Explicit gap (not space-between) so the buffer between pills can't
     collapse if pill height ever changes - 24px pill + 8px gap + 24px
     pill = 56px, matching the cover art's height exactly. */
  #metaPillCol { min-width:0; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; }
  .marqueeBox.scrolling .marqueeInner { animation-name: marqueeScroll; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Fixed height (not padding-driven) so chapterPill/speedPill render at
     identical heights regardless of their differing content. */
  .pill { flex-shrink:0; display:flex; align-items:center; gap:6px; height:24px; box-sizing:border-box; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel-bg); color:var(--ink); font-size:12px; white-space:nowrap; }
  .pill svg { flex-shrink:0; }

  #speedOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); align-items:center; justify-content:center; z-index:10; touch-action:none; }
  #speedPanel { width:min(320px, 84vw); background:var(--panel-bg-2); border:1px solid var(--border); border-radius:16px; padding:20px; box-sizing:border-box; }
  #speedValueRow { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  #speedValueRow button { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--control-btn-bg); color:var(--ink); font-size:20px; }
  #speedValue { font-size:26px; font-weight:600; color:var(--accent); }
  #speedSliderRow { display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); margin-bottom:14px; }
  #speedSlider { flex:1; }
  #speedPresets { display:flex; justify-content:space-between; gap:6px; }
  #speedPresets button { flex:1; padding:8px 0; border-radius:10px; border:1px solid var(--border); background:var(--control-btn-bg); color:var(--ink); font-size:12px; }
</style>
</head>

             a right-pointing triangle's flat left edge reads as heavier
             than its tip, so bounding-box centering looks off-center to
             the left; nudging it right is the standard optical fix. -->
          <polygon points="6.5 3 20.5 12 6.5 21 6.5 3"/>
