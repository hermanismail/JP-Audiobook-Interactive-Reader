<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b0b0d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Roboto, Arial, sans-serif' font-weight='700' font-size='20' fill='%23e08a3c'%3ES%3C/text%3E%3C/svg%3E">
<title>SHAMA Player</title>
<!--
  LAYER 4 of the app-shell rebuild (see CLAUDE.md's layer map). The reader
  screen only - a faithful port of _legacy-index.html's #readerScreen (zen
  mode, karaoke text reveal, gestures, volume/speed popups, marquee, wake
  lock, responsive player-controls collapse), with three real changes:

  1. Chapter/book identity comes entirely from the URL (?book=&chapter=&t=),
     set by chapter.html's playChapter() - not from any ambient "currently
     selected book" concept. Sync/images/audio/cover/metadata are fetched
     directly via REST (same endpoints tv-player.html already uses
     successfully), NOT through bridge-shim.js/window.Android - there is no
     "prepare" step, real Range-serving handles seeking on its own, so
     chapterTimeOffset's whole fake-seek workaround (needed only for the
     Android app's SAF+WebView limitations) doesn't apply here either.

  2. Registers on the shared WebSocket as role:'player' on load (see
     server/src/sync.js's device-priority rules) - arriving here is itself
     what claims active-device status, no separate self-load round-trip
     needed. A `killed` command (this device displaced by a new normal
     player or tv-player elsewhere) shows a plain "SHAMA Session Ended."
     screen with a single Home button - no auto-recovery, matches the
     rebuild spec exactly (replacing the old "Playing on Other Device /
     Refresh to play" design).

  3. No-fill design language applied throughout (.iconBtn/.pill/speed
     panel buttons all lost their background fill) to match index.html/
     library.html/chapter.html - the one deliberate deviation from "keep
     it exactly like the current working player."

  The Library icon always navigates to chapter.html?book=<current
  book>&mode=player - opening this page always forces player mode there,
  per the rebuild spec.
-->
<style>
  :root {
    --bg:#0b0b0d; --ink:#e8e6ea; --panel-bg:#17161a; --panel-bg-2:#1c1a20;
    --border:#3a3840; --muted:#9b93b0; --muted2:#9a97a0; --placeholder-ink:#4a4650;
    --accent:#e08a3c; --progress-track:#2a2830;
    --timerow-ink:#c9c6cf;
    --read-text-base:#d6d6d6; --read-text-highlight-a:#F6CAC0; --read-text-b:#d6d6d6;
    --zen-overlay-bg:rgba(23,22,26,0.82);
  }
  :root.light {
    --bg:#e5decf; --ink:#000000; --panel-bg:#ddd3bd; --panel-bg-2:#efe8d8;
    --border:#b8ab8e; --muted:#7a6f58; --muted2:#8a7f68; --placeholder-ink:#a89a7d;
    --accent:#e08a3c; --progress-track:#cfc3a8;
    --timerow-ink:#4a4030;
    --read-text-base:#d0d0d0; --read-text-highlight-a:#000000; --read-text-b:#000000;
    --zen-overlay-bg:rgba(221,211,189,0.88);
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Roboto","Arial",sans-serif; overflow:hidden; }

  #readerScreen { display:none; position:relative; height:100%; box-sizing:border-box; flex-direction:column; padding:16px; gap:10px; touch-action:none; }

  #readerTopBar { position:absolute; top:16px; left:16px; z-index:5; display:flex; gap:8px; }
  /* No fill, per the explicit "keep consistency of no fill for all pills
     and buttons" instruction - every other button in this build already
     uses the same border+currentColor affordance with no background. */
  .iconBtn { box-sizing:border-box; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--ink); display:flex; align-items:center; justify-content:center; padding:0; font-family:inherit; }
  .iconBtn:disabled { opacity:0.35; cursor:default; }

  #playerControls { display:flex; justify-content:center; align-items:center; gap:20px; min-width:0; }
  #playerControls.hide-chapter #prevChapterBtn,
  #playerControls.hide-chapter #nextChapterBtn { display:none; }
  #playerControls.hide-part #prevPartBtn,
  #playerControls.hide-part #nextPartBtn { display:none; }
  #playerControls.hide-playpause #playPauseBtn { display:none; }

  #volumeToggleBtn { position:absolute; top:16px; right:16px; z-index:5; }
  #presetToggleBtn { position:absolute; top:16px; right:60px; z-index:5; font-size:16px; font-weight:500; }
  #themeToggleBtn { position:absolute; top:16px; right:104px; z-index:5; }
  #fullscreenToggleBtn, #forceZenBtn { position:absolute; top:16px; right:148px; z-index:5; }
  #forceZenBtn.active { border-color:var(--accent); color:var(--accent); }
  @media (pointer: coarse) { #fullscreenToggleBtn { display:none; } }
  @media (pointer: fine) { #forceZenBtn { display:none; } }
  /* Left of the zen/fullscreen slot, same 44px spacing as the rest of
     this row (16/60/104/148/192). Plain "C" glyph like presetToggleBtn's
     "あ" - explicit Roboto since .iconBtn's font-family:inherit would
     otherwise just pick up whatever body/readerScreen happen to cascade
     down, not necessarily Roboto. color:var(--ink) (inherited from
     .iconBtn) already flips with the dark/light theme same as every
     other icon here - no extra theme-specific rule needed. */
  /* No .active/highlighted state - like presetToggleBtn ("あ"), this
     button's own appearance never changes; it just cycles the mode
     silently on each click (off/animated/static/remote - see the JS). */
  #subtitleToggleBtn { position:absolute; top:16px; right:192px; z-index:5; font-family:"Roboto","Arial",sans-serif; font-size:15px; font-weight:700; }

  #volumePopup {
    display:none; flex-direction:column; gap:10px;
    position:absolute; top:62px; right:16px; z-index:5;
  }
  #volumePopup.show { display:flex; }
  #volumeLevelPill { font-size:13px; font-weight:600; cursor:default; }

  #frame { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; padding:64px 26px 26px; box-sizing:border-box; }
  #pageText { writing-mode:vertical-rl; height:100%; letter-spacing:0.06em; font-weight:500; transition:opacity 0.3s; opacity:1; color:var(--read-text-base); font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif; overflow-wrap:anywhere; }
  #pageText span { transition:color 0.2s ease, opacity 0.15s linear; }
  /* Tate-chu-yoko (縦中横): a run of half-width digits gets its own span,
     capped at 2 characters (see buildChunkSpans() - not the old one-
     span-per-character map), with this applied, so "17" lays out as one
     horizontal pair rotated upright within the vertical column instead of
     "1" then "7" stacked as two separate rows. Deliberately `all`, not
     the more semantically-fitting `text-combine-upright: digits 2` -
     confirmed via caniuse that the `digits` value has ZERO support in any
     browser (an initial attempt using it silently did nothing, matching
     exactly that). `all` combines everything in the span uniformly and
     IS well supported, which is why the JS does the "at most 2 digits
     per span" capping itself instead of leaving it to CSS. */
  #pageText span.tcy { text-combine-upright: all; }
  #measure { position:absolute; visibility:hidden; top:-9999px; left:-9999px; writing-mode:vertical-rl; letter-spacing:0.06em; font-weight:500; font-family:"Yu Mincho","YuMincho","游明朝","Hiragino Mincho ProN","MS Mincho",serif; white-space:normal; overflow-wrap:anywhere; }
  #loadingOverlay { display:none; color:var(--muted); font-size:14px; text-align:center; }

  /* Fixed-position overlay (see the HTML comment on this element for why
     it lives outside #readerScreen), JS-positioned against #frame's own
     bottom edge each time it's shown - see positionSubtitleOverlay().
     Deliberately not gated by chrome-hidden/#zenChromeOverlay - a
     translation aid is core reading content, not a control, so it stays
     visible in zen mode even while the icon row/progress bar are
     hidden, same as the vertical text itself never hides.
     pointer-events:none so it never intercepts the tap/swipe gestures
     the reading area underneath it relies on. */
  #subtitleOverlay {
    display:none; position:fixed; left:0; right:0; z-index:4; pointer-events:none;
    box-sizing:border-box; padding:6px 5%; text-align:center;
    white-space:normal; overflow-wrap:anywhere; overflow:hidden;
    font-family:'Special Elite', monospace; color:var(--ink);
  }
  #subtitleOverlay.show { display:block; }
  /* Scoped to only the per-word spans showSubtitleCue() creates INSIDE
     #subtitleText, not #subtitleOverlay span generally - #subtitleText
     is itself a <span> (a direct child of #subtitleOverlay), so a bare
     "#subtitleOverlay span" selector matched it too and left it stuck at
     opacity:0 forever (no code ever sets ITS opacity, only its
     children's) - every word inside it was correctly fading in, just
     invisible behind its own permanently-transparent wrapper. This was
     the real cause of the text-never-paints symptom chased earlier via
     the ancestry/compositing investigation below - a plain cascade bug,
     not a paint/compositing one. */
  #subtitleText > span { opacity:0; transition:opacity 0.15s linear; }

  #readerScreen.chrome-hidden #readerTopBar,
  #readerScreen.chrome-hidden #presetToggleBtn,
  #readerScreen.chrome-hidden #themeToggleBtn,
  #readerScreen.chrome-hidden #fullscreenToggleBtn,
  #readerScreen.chrome-hidden #forceZenBtn,
  #readerScreen.chrome-hidden #subtitleToggleBtn,
  #readerScreen.chrome-hidden #volumeToggleBtn,
  #readerScreen.chrome-hidden #volumePopup { display:none; }
  #readerScreen.chrome-hidden #zenChromeOverlay { display:none !important; }

  #readerScreen.zen #frame { padding:5vh 5vw; gap:2vw; justify-content:flex-end; }
  #readerScreen.zen.desktop #frame { padding:3vh 3vw; gap:2vw; justify-content:flex-end; }
  #readerScreen.zen.desktop.fullscreen #frame { padding:5vh 5vw; }

  #zenChromeOverlay { display:contents; }
  #readerScreen.zen:not(.desktop) #zenChromeOverlay,
  #readerScreen.zen.desktop.fullscreen #zenChromeOverlay {
    display:flex; flex-direction:column; gap:10px;
    position:absolute; left:16px; right:16px; bottom:16px; z-index:6;
    background:var(--zen-overlay-bg); border-radius:16px; padding:12px 16px;
    box-sizing:border-box; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }

  #zenImageWrap { display:none; align-items:center; flex-shrink:0; }
  /* cover (not contain) - fills the entire column box, center-cropping
     whichever axis overflows, rather than letterboxing empty space when
     the image's own aspect ratio doesn't match the column's. The column
     box itself (#zenImageWrap) still gets its fixed pixel size from JS
     (recalcZenColumns()) regardless of this choice, so a differently-
     shaped image rotating in still can't resize the column - it just
     crops differently within the same unchanged box. */
  #zenImage { height:100%; width:100%; object-fit:cover; border-radius:8px; }
  /* Rectangular feather, shared with the zen side image and the meta
     row's cover art (both #coverArt and its no-cover placeholder) - same
     two-linear-gradient intersect/source-in mask used everywhere else in
     this app. */
  #zenImage, #coverArt, #coverPlaceholder {
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-composite: source-in;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-image:
      linear-gradient(to right, transparent 0%, black 30%, black 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    mask-composite: intersect;
    mask-repeat: no-repeat;
    mask-size: 100% 100%;
  }

  #bookmarkToast { position:fixed; left:50%; top:16px; transform:translateX(-50%);
    background:var(--panel-bg); border:1px solid var(--border); color:var(--ink); padding:8px 16px;
    border-radius:999px; font-size:13px; opacity:0; transition:opacity 0.3s;
    pointer-events:none; z-index:20; white-space:nowrap; }
  #bookmarkToast.show { opacity:1; }

  #timeRow { display:flex; justify-content:space-between; font-size:12px; color:var(--timerow-ink); padding:0 2px; }

  #progressTrack { position:relative; height:22px; display:flex; align-items:center; }
  #progressTrackLine { position:relative; width:100%; height:3px; background:var(--progress-track); border-radius:2px; overflow:visible; }
  #progressFill { position:absolute; left:0; top:0; height:100%; width:0%; background:var(--accent); border-radius:2px; }
  #progressMarker { position:absolute; top:50%; left:0%; width:12px; height:12px; margin-left:-6px; margin-top:-6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 6px rgba(224,138,60,0.15); }

  #metaRow { display:grid; grid-template-columns: minmax(0, 220px) minmax(36px, 1fr) auto; align-items:center; gap:12px; }
  #metaLeftInfo { display:flex; align-items:center; gap:12px; min-width:0; }
  #coverArt, #coverPlaceholder { width:56px; height:56px; border-radius:6px; flex-shrink:0; object-fit:cover; background:var(--panel-bg-2); border:1px solid var(--border); }
  #coverPlaceholder { display:flex; align-items:center; justify-content:center; color:var(--placeholder-ink); font-size:22px; }

  #metaTextCol { min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  #chapterTitle { min-width:0; font-size:16px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .marqueeBox { min-width:0; overflow:hidden; white-space:nowrap; font-size:12px; color:var(--muted); }
  .marqueeBox .marqueeInner { display:inline-flex; }
  .marqueeBox .marqueeGap { display:inline-block; width:36px; flex-shrink:0; }

  #metaPillCol { min-width:0; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; }
  .marqueeBox.scrolling .marqueeInner { animation-name: marqueeScroll; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .pill { flex-shrink:0; display:flex; align-items:center; gap:6px; height:24px; box-sizing:border-box; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--ink); font-size:12px; white-space:nowrap; font-family:inherit; }
  .pill svg { flex-shrink:0; }

  #speedOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); align-items:center; justify-content:center; z-index:10; touch-action:none; }
  #speedPanel { width:min(320px, 84vw); background:var(--panel-bg-2); border:1px solid var(--border); border-radius:16px; padding:20px; box-sizing:border-box; }
  #speedValueRow { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  #speedValueRow button { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--ink); font-size:20px; font-family:inherit; }
  #speedValue { font-size:26px; font-weight:600; color:var(--accent); }
  #speedSliderRow { display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); margin-bottom:14px; }
  #speedSlider { flex:1; }
  #speedPresets { display:flex; justify-content:space-between; gap:6px; }
  #speedPresets button { flex:1; padding:8px 0; border-radius:10px; border:1px solid var(--border); background:none; color:var(--ink); font-size:12px; font-family:inherit; }

  #sessionEndedScreen {
    display:none; position:fixed; inset:0; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:var(--bg); z-index:50; text-align:center;
    padding:24px; box-sizing:border-box;
  }
  #sessionEndedTitle { font-size:48px; font-weight:700; letter-spacing:0.15em; color:var(--ink); }
  #sessionEndedSubtitle { font-size:18px; color:var(--muted); }
  #sessionEndedHomeBtn {
    display:flex; align-items:center; gap:8px; height:46px; padding:0 24px; margin-top:8px;
    border-radius:999px; border:1px solid var(--border); background:none; color:var(--ink);
    text-decoration:none; font-size:14px; font-weight:600; text-transform:uppercase;
    font-family:"Roboto","Arial",sans-serif;
  }
</style>
</head>
<body>

<div id="readerScreen">
  <div id="readerTopBar">
    <button id="libraryBtn" class="iconBtn" aria-label="Back to chapter list">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
    </button>
    <button id="bookmarkBtn" class="iconBtn" aria-label="Bookmark this spot">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
    </button>
  </div>
  <button id="fullscreenToggleBtn" class="iconBtn" aria-label="Toggle fullscreen zen mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
  </button>
  <button id="forceZenBtn" class="iconBtn" aria-label="Toggle zen mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
  <button id="subtitleToggleBtn" class="iconBtn" aria-label="Toggle translation subtitle">C</button>
  <button id="themeToggleBtn" class="iconBtn" aria-label="Toggle light/dark theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <button id="presetToggleBtn" class="iconBtn" aria-label="Toggle text animation preset">あ</button>
  <button id="volumeToggleBtn" class="iconBtn" aria-label="Volume">
    <svg id="volumeIconNormal" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
    <svg id="volumeIconMuted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
  </button>
  <div id="volumePopup">
    <button id="volumeUpBtn" class="iconBtn" aria-label="Increase volume">+</button>
    <div id="volumeLevelPill" class="iconBtn">100</div>
    <button id="volumeDownBtn" class="iconBtn" aria-label="Decrease volume">&minus;</button>
    <button id="muteBtn" class="iconBtn" aria-label="Mute">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
    </button>
  </div>

  <div id="frame">
    <div id="pageText"></div>
    <div id="loadingOverlay">Loading&hellip;</div>
    <div id="measure"></div>
    <div id="zenImageWrap"><img id="zenImage"></div>
  </div>

  <div id="bookmarkToast"></div>

  <div id="zenChromeOverlay">
  <div id="timeRow">
    <span id="elapsedLabel">0:00</span>
    <span id="totalLabel">0:00</span>
  </div>
  <div id="progressTrack">
    <div id="progressTrackLine">
      <div id="progressFill"></div>
      <div id="progressMarker"></div>
    </div>
  </div>

  <div id="metaRow">
    <div id="metaLeftInfo">
      <img id="coverArt" style="display:none;">
      <div id="coverPlaceholder">&#9834;</div>
      <div id="metaTextCol">
        <div id="chapterTitle"></div>
        <div id="authorTitle" class="marqueeBox"></div>
      </div>
    </div>

    <div id="playerControls">
      <button id="prevChapterBtn" class="iconBtn" aria-label="Previous chapter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="prevPartBtn" class="iconBtn" aria-label="Previous part">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="playPauseBtn" class="iconBtn" aria-label="Play">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6.5 3 20.5 12 6.5 21 6.5 3"/>
        </svg>
        <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="nextPartBtn" class="iconBtn" aria-label="Next part">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button id="nextChapterBtn" class="iconBtn" aria-label="Next chapter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <div id="metaPillCol">
      <div id="chapterPill" class="pill"></div>
      <button id="speedPill" class="pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12 L16 8"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="speedLabel">1.00x</span>
      </button>
    </div>
  </div>
  </div>

  <audio id="audio"></audio>
</div>

<!-- Declared as a direct child of <body> (not nested inside #readerScreen)
     so it's positioned via JS (see positionSubtitleOverlay()) against

     (An earlier debugging pass chased the text never painting here as a
     suspected ancestry/compositing bug and moved the markup outside
     #readerScreen as a workaround - the real cause, found afterward, was
     mundane: the CSS selector `#subtitleOverlay span` also matched
     #subtitleText itself, since it's a <span> too, pinning it at
     opacity:0 forever regardless of its children's own opacity. See the
     `#subtitleText > span` rule above. The body-level placement was kept
     anyway since it's a perfectly correct design on its own merits.) -->
