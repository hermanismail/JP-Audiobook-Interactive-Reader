<script>
(function(){
  var readerScreen = document.getElementById('readerScreen');
  var sessionEndedScreen = document.getElementById('sessionEndedScreen');

  var audio = document.getElementById('audio');
  var pageText = document.getElementById('pageText');
  var measure = document.getElementById('measure');
  var frame = document.getElementById('frame');
  var loadingOverlay = document.getElementById('loadingOverlay');
  var bookmarkToast = document.getElementById('bookmarkToast');
  var libraryBtn = document.getElementById('libraryBtn');
  var bookmarkBtn = document.getElementById('bookmarkBtn');
  var presetToggleBtn = document.getElementById('presetToggleBtn');
  var volumeToggleBtn = document.getElementById('volumeToggleBtn');
  var volumePopup = document.getElementById('volumePopup');
  var volumeUpBtn = document.getElementById('volumeUpBtn');
  var volumeDownBtn = document.getElementById('volumeDownBtn');
  var volumeLevelPill = document.getElementById('volumeLevelPill');
  var muteBtn = document.getElementById('muteBtn');
  var volumeIconNormal = document.getElementById('volumeIconNormal');
  var volumeIconMuted = document.getElementById('volumeIconMuted');
  var themeToggleBtn = document.getElementById('themeToggleBtn');
  var fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
  var forceZenBtn = document.getElementById('forceZenBtn');
  var subtitleToggleBtn = document.getElementById('subtitleToggleBtn');
  var subtitleOverlay = document.getElementById('subtitleOverlay');
  var subtitleText = document.getElementById('subtitleText');
  var zenImageWrap = document.getElementById('zenImageWrap');
  var zenImage = document.getElementById('zenImage');

  var elapsedLabel = document.getElementById('elapsedLabel');
  var totalLabel = document.getElementById('totalLabel');
  var progressTrack = document.getElementById('progressTrack');
  var progressFill = document.getElementById('progressFill');
  var progressMarker = document.getElementById('progressMarker');

  var playerControls = document.getElementById('playerControls');
  var prevChapterBtn = document.getElementById('prevChapterBtn');
  var prevPartBtn = document.getElementById('prevPartBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var nextPartBtn = document.getElementById('nextPartBtn');
  var nextChapterBtn = document.getElementById('nextChapterBtn');

  var coverArt = document.getElementById('coverArt');
  var coverPlaceholder = document.getElementById('coverPlaceholder');
  var chapterTitleEl = document.getElementById('chapterTitle');
  var authorTitleEl = document.getElementById('authorTitle');
  var chapterPill = document.getElementById('chapterPill');

  var speedPill = document.getElementById('speedPill');
  var speedLabel = document.getElementById('speedLabel');
  var speedOverlay = document.getElementById('speedOverlay');
  var speedValue = document.getElementById('speedValue');
  var speedSlider = document.getElementById('speedSlider');
  var speedDown = document.getElementById('speedDown');
  var speedUp = document.getElementById('speedUp');

  var params = new URLSearchParams(location.search);
  var urlBookId = params.get('book');
  var urlChapterBase = params.get('chapter');
  var urlResumeSeconds = parseFloat(params.get('t') || '0') || 0;

  var bookId = null;
  var chapterBase = null;
  var allChapters = [];
  var chunks = [];
  var idx = -1;
  var shown = false;
  var chapterDuration = 0;
  var currentSpeed = 1.0;
  var scrubbing = false;
  var chunkSpans = [];
  var chunkLitCount = 0;
  var readerReady = false; // guards zen/etc. from running before a chapter's ever been opened
  var killed = false;
  var loadToken = 0; // supersedes stale in-flight loads (rapid remote `load` commands)

  var PAD_X = 26, PAD_TOP = 64, PAD_BOTTOM = 26, MAX_F = 68, ABS_MIN = 10;
  var ZEN_TOP_BOTTOM_FRACTION = 0.05;
  var ZEN_LEFT_FRACTION = 0.05;
  var ZEN_RIGHT_FRACTION = 0.05;
  var ZEN_GAP_FRACTION = 0.02;
  var ZEN_DESKTOP_PADDING_V_FRACTION = 0.03;
  var ZEN_DESKTOP_PADDING_H_FRACTION = 0.03;
  var ZEN_DESKTOP_FULLSCREEN_PADDING_FRACTION = 0.05;
  var ZEN_DESKTOP_GAP_FRACTION = 0.02;
  var ZEN_DESKTOP_MIN_WIDTH = 800;
  // Zen mode's own vh-based top padding (3-5% of screen height) is often
  // thinner than the top icon row's real footprint (16px offset + 36px
  // tall = 52px) at real desktop/tablet heights, especially once chrome
  // is actually visible (desktop zen windowed, or a chrome-reveal tap/
  // hover while zen is otherwise chrome-hidden) - the vertical text/image
  // pair then renders flush against (or under) the icons. Whenever chrome
  // is visible, the effective top inset is bumped up to at least this
  // fixed px clearance (same value as the non-zen mode's own PAD_TOP,
  // which exists for the identical reason) - see recalcZenColumns().
  var ZEN_CHROME_TOP_CLEARANCE = PAD_TOP;

  // Flat height reserved at the bottom of the reading area for the
  // subtitle overlay whenever it's toggled on - one fixed number rather
  // than measuring the actual current cue, so the vertical text/zen image
  // don't resize every time a cue appears or disappears. Sized for ~2
  // wrapped lines at SUBTITLE_FONT_SIZE (the overlay wraps now instead of
  // a single fitted line - see #subtitleOverlay's CSS) plus its own
  // padding, not just 1 - real iPad zen-mode testing showed a cue that
  // wrapped to 2 lines getting its bottom line pushed past the reserved
  // gap and off-screen at the old (1-line) value. splitCueBySentence()
  // below also shortens most cues so they need fewer lines in the first
  // place, but doesn't guarantee a single sentence never wraps twice.
  var SUBTITLE_RESERVED_H = 84;

  var zenActive = false;
  var zenDesktopActive = false;
  var zenImageList = [];
  var zenCurrentImageUrl = null;
  var zenColW = 0;
  var zenImgColW = 0;
  var zenRowH = 0;

  function chapterNumber(base){
    if (!base) return null; // reportState() can fire (a spurious audio event) before chapterBase is ever set
    var m = base.match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : null;
  }

  function humanize(base){
    var n = chapterNumber(base);
    return n !== null ? ('Chapter ' + n) : base;
  }

  function formatTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.round(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var mm = (h > 0 && m < 10) ? ('0' + m) : String(m);
    var ss = sec < 10 ? ('0' + sec) : String(sec);
    return h > 0 ? (h + ':' + mm + ':' + ss) : (m + ':' + ss);
  }

  async function fetchJson(url, fallback){
    try {
      var res = await fetch(url);
      if (!res.ok) return fallback;
      return await res.json();
    } catch (e) {
      return fallback;
    }
  }

  function goToLibrary(){
    location.href = 'chapter.html?book=' + encodeURIComponent(bookId || urlBookId || '') + '&mode=player';
  }
  libraryBtn.addEventListener('click', goToLibrary);

  // The real chapter number parsed from the filename, and the highest
  // such number present in the folder - not folder-relative position/
  // count, since chapters get copied over in batches and old ones
  // deleted after reading, so the folder is rarely a contiguous run.
  // Shared with reportState() so remote.html's chapter pill (driven by
  // the WS state broadcast) reads identically to this page's own.
  function chapterTotalCount(){
    return allChapters.reduce(function(max, base){
      var n = chapterNumber(base);
      return (n !== null && n > max) ? n : max;
    }, 0);
  }

  function updateChapterPill(){
    var chapterIndex = chapterNumber(chapterBase) || 0;
    var chapterTotal = chapterTotalCount();
    var chunkPos = idx >= 0 ? (idx + 1) : 0;
    chapterPill.textContent = 'Chapter: ' + chapterIndex + '/' + chapterTotal + ' Part: ' + chunkPos + '/' + chunks.length;
    updateChapterNavButtons();
  }

  function updateChapterNavButtons(){
    var pos = allChapters.indexOf(chapterBase);
    prevChapterBtn.disabled = !(pos > 0);
    nextChapterBtn.disabled = !(pos >= 0 && pos < allChapters.length - 1);
    updatePlayerControlsFit();
  }

  function goPrevChapter(){
    var pos = allChapters.indexOf(chapterBase);
    if (pos > 0) openChapter(bookId, allChapters[pos - 1]);
  }
  function goNextChapter(){
    var pos = allChapters.indexOf(chapterBase);
    if (pos >= 0 && pos < allChapters.length - 1) openChapter(bookId, allChapters[pos + 1]);
  }

  var PLAYER_CONTROLS_BTN = 36;
  var PLAYER_CONTROLS_GAP = 20;
  function playerControlsRowWidth(n){
    return n * PLAYER_CONTROLS_BTN + (n - 1) * PLAYER_CONTROLS_GAP;
  }
  var PLAYER_CONTROLS_MIN_VIEWPORT = 450;

  function updatePlayerControlsFit(){
    playerControls.classList.remove('hide-chapter', 'hide-part');
    var available = playerControls.clientWidth;
    if (playerControlsRowWidth(5) > available) {
      playerControls.classList.add('hide-chapter');
      if (playerControlsRowWidth(3) > available) playerControls.classList.add('hide-part');
    }
    playerControls.classList.toggle('hide-playpause', window.innerWidth < PLAYER_CONTROLS_MIN_VIEWPORT);
  }
  window.addEventListener('resize', updatePlayerControlsFit);

  function fitFontSize(text, availW, availH){
    measure.style.height = availH + 'px';
    for(var f = MAX_F; f >= ABS_MIN; f -= 1){
      measure.style.fontSize = f + 'px';
      measure.textContent = text;
      if(measure.scrollWidth <= availW) return f;
    }
    return ABS_MIN;
  }

  function recalcZenColumns(){
    if (!zenActive) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var leftPad, rightPad, topBottomPad, gapW;
    if (zenDesktopActive) {
      var desktopPadFraction = document.fullscreenElement
        ? ZEN_DESKTOP_FULLSCREEN_PADDING_FRACTION
        : ZEN_DESKTOP_PADDING_H_FRACTION;
      var desktopPadVFraction = document.fullscreenElement
        ? ZEN_DESKTOP_FULLSCREEN_PADDING_FRACTION
        : ZEN_DESKTOP_PADDING_V_FRACTION;
      leftPad = vw * desktopPadFraction;
      rightPad = leftPad;
      topBottomPad = vh * desktopPadVFraction;
      gapW = vw * ZEN_DESKTOP_GAP_FRACTION;
    } else {
      leftPad = vw * ZEN_LEFT_FRACTION;
      rightPad = vw * ZEN_RIGHT_FRACTION;
      topBottomPad = vh * ZEN_TOP_BOTTOM_FRACTION;
      gapW = vw * ZEN_GAP_FRACTION;
    }
    // The top icon row (readerTopBar + the right-anchored icon column) is
    // only actually hidden while chrome-hidden - whenever chrome is
    // visible (desktop zen windowed, or a momentary reveal), the top
    // inset needs to clear it regardless of what the vh-based fraction
    // alone would give (see ZEN_CHROME_TOP_CLEARANCE above). Only the top
    // edge has icons, so this is asymmetric - bottom keeps the plain
    // fraction-based value.
    var chromeVisible = !readerScreen.classList.contains('chrome-hidden');
    var topPad = chromeVisible ? Math.max(topBottomPad, ZEN_CHROME_TOP_CLEARANCE) : topBottomPad;
    frame.style.paddingTop = topPad + 'px';
    frame.style.paddingBottom = topBottomPad + 'px';
    frame.style.paddingLeft = leftPad + 'px';
    frame.style.paddingRight = rightPad + 'px';
    // Reserve room at the bottom for the subtitle overlay via MARGIN, not
    // padding - #frame is `flex:1; box-sizing:border-box`, so its real
    // on-screen box size comes purely from flex layout regardless of its
    // own padding value; only margin actually shrinks that allotted box
    // (confirmed via a live test - padding here left the overlay
    // overlapping the progress bar instead of sitting above it). This
    // matters even in zen: whenever chrome is visible without being
    // hidden-and-absolutely-overlaid (desktop zen, windowed, non-
    // fullscreen), #timeRow/#progressTrack/#metaRow are still real flex
    // siblings sharing the column with #frame, same as non-zen mode - see
    // applyNonZenSubtitlePadding()'s comment for the fuller explanation.
    frame.style.marginBottom = subtitlesShowOnPlayer() ? SUBTITLE_RESERVED_H + 'px' : '';

    var innerW = frame.clientWidth - leftPad - rightPad;
    var imgH = frame.clientHeight - topPad - topBottomPad;
    var colW = (innerW - gapW) / 2;
    zenImgColW = Math.max(20, colW);
    zenColW = Math.max(40, colW);
    zenRowH = imgH;
    zenImageWrap.style.width = zenImgColW + 'px';
    zenImageWrap.style.height = zenRowH + 'px';
  }

  // Clears the inline padding recalcZenColumns() sets above, so leaving
  // zen falls back to the plain CSS rule (#frame { padding:64px 26px
  // 26px }) instead of being stuck with zen's last computed values. The
  // trailing call re-derives margin-bottom (zen's own subtitle
  // reservation is also margin, cleared along with everything else above)
  // for whichever state non-zen mode should be in.
  function resetZenFramePadding(){
    frame.style.paddingTop = '';
    frame.style.paddingBottom = '';
    frame.style.paddingLeft = '';
    frame.style.paddingRight = '';
    applyNonZenSubtitlePadding();
  }

  // Non-zen mode's #frame padding is otherwise pure static CSS (never
  // touched by JS). Reserving space here needs MARGIN, not padding:
  // #frame is a `flex:1; box-sizing:border-box` item, so its actual
  // on-screen (border-box) size is whatever the flex layout hands it,
  // completely independent of its own padding - padding-bottom would
  // only shrink the *inner* content area, leaving frame's real bottom
  // edge (and the fixed-position subtitle overlay anchored to it via
  // positionSubtitleOverlay()) exactly where it always was, overlapping
  // the progress bar below instead of leaving a gap above it (confirmed
  // via a live browser test - the overlay rendered UNDER the seek bar).
  // Margin, unlike padding, IS subtracted before flex-grow distributes
  // space, so it actually pushes frame's real bottom edge upward and
  // opens genuine screen space for the overlay to occupy. No-op while
  // zen is active - zen's own #frame padding legitimately reserves space
  // there instead, since frame fills the *entire* screen in zen
  // (the progress/meta rows become an absolutely-positioned overlay,
  // not real flex siblings, once chrome is hidden - see recalcZenColumns()).
  function applyNonZenSubtitlePadding(){
    if (zenActive) return;
    frame.style.marginBottom = subtitlesShowOnPlayer() ? SUBTITLE_RESERVED_H + 'px' : '';
  }

  // Re-derives the zen column layout and re-fits the current page against
  // it - call this whenever chrome-hidden toggles while zen is active
  // (play/pause on mobile, a chrome-reveal tap/hover on desktop
  // fullscreen), since the top clearance above depends on chrome's
  // current visibility, not just the viewport size.
  function refreshZenLayout(){
    if (!zenActive) return;
    recalcZenColumns();
    if (shown && idx >= 0) showPage(idx);
    updateZenImageForTime(audio.currentTime || 0);
    if (subtitleOverlay.classList.contains('show')) positionSubtitleOverlay();
  }

  function getAvailableSpace(){
    if (!zenActive || zenImageWrap.style.display === 'none') {
      // No extra subtraction needed here for the subtitle reservation -
      // applyNonZenSubtitlePadding() below reserves it via frame's own
      // margin-bottom, which actually shrinks frame.clientHeight itself
      // (unlike padding, which box-sizing:border-box would have absorbed
      // invisibly - see that function's comment for why margin was needed).
      return {
        w: frame.clientWidth - PAD_X * 2,
        h: frame.clientHeight - PAD_TOP - PAD_BOTTOM
      };
    }
    return { w: zenColW, h: zenRowH };
  }

  // One span per character, same as before, EXCEPT a run of consecutive
  // ASCII digits ("17", "22") gets grouped into a single span with the
  // .tcy class (see its CSS) so it renders tate-chu-yoko instead of each
  // digit stacked on its own row. Everything downstream (chunkLitCount,
  // updateChunkHighlight, applyInitialSpanState) just walks chunkSpans by
  // index and colors/fades whatever's inside each one - a digit run
  // becomes one highlight unit, not several, which needs no changes there.
  var TCY_GROUP_SIZE = 2; // digits combined per span - see the .tcy CSS comment on why this is done here, not via `text-combine-upright: digits 2`

  function buildChunkSpans(text){
    var spans = [];
    var chars = Array.from(text);
    var i = 0;
    while (i < chars.length) {
      if (chars[i] >= '0' && chars[i] <= '9') {
        var j = i;
        while (j < chars.length && chars[j] >= '0' && chars[j] <= '9') j++;
        // Emit the run in groups of at most TCY_GROUP_SIZE digits each -
        // "1234" becomes two combined pairs ("12", "34"), not one
        // 4-digit span text-combine-upright:all would cram illegibly
        // small into a single character-width cell.
        for (var k = i; k < j; k += TCY_GROUP_SIZE) {
          var group = chars.slice(k, Math.min(k + TCY_GROUP_SIZE, j)).join('');
          var span = document.createElement('span');
          span.textContent = group;
          if (group.length > 1) span.className = 'tcy';
          pageText.appendChild(span);
          spans.push(span);
        }
        i = j;
      } else {
        var single = document.createElement('span');
        single.textContent = chars[i];
        pageText.appendChild(single);
        spans.push(single);
        i++;
      }
    }
    return spans;
  }

  function showPage(i){
    var chunk = chunks[i];
    var space = getAvailableSpace();
    var f = fitFontSize(chunk.text, space.w, space.h);
    pageText.style.height = (zenActive && zenImageWrap.style.display !== 'none') ? (space.h + 'px') : '';
    pageText.style.opacity = '0';
    pageText.style.fontSize = f + 'px';

    pageText.innerHTML = '';
    chunkSpans = buildChunkSpans(chunk.text);

    pageText.style.display = 'none';
    void pageText.offsetHeight;
    pageText.style.display = '';

    chunkLitCount = Math.min(PRELIT_COUNT, chunkSpans.length);
    applyInitialSpanState();

    requestAnimationFrame(function(){ pageText.style.opacity = '1'; });
  }

  function blankPage(){
    pageText.style.opacity = '0';
    pageText.innerHTML = '';
    chunkSpans = [];
    chunkLitCount = 0;
  }

  var zenMql = window.matchMedia('(orientation: landscape)');
  var zenCoarsePointerMql = window.matchMedia('(pointer: coarse)');

  // Real browser Fullscreen on touch devices: there is no native
  // "immersive mode" bridge to call here (unlike the Android app) - this
  // is a plain browser tab, so entering zen on a phone/tablet needs to
  // request real Fullscreen itself to actually hide the browser's own
  // address bar/chrome, not just this page's own icon row. Wrapped in a
  // .catch() since requestFullscreen() can reject (e.g. not called from
  // a direct user gesture, which a matchMedia 'change' listener isn't
  // always treated as) - the .zen/.chrome-hidden classes still take
  // effect either way, this is strictly an enhancement on top of them.
  function requestMobileFullscreen(){
    if (document.fullscreenElement) return;
    var p = document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(function(e){ console.log('mobile requestFullscreen failed: ' + e); });
  }
  function exitMobileFullscreenIfNeeded(){
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function(){});
    }
  }

  function applyZenState(){
    if (!readerReady) return; // only while a chapter's open
    var mobileMatch = zenMql.matches && zenCoarsePointerMql.matches;
    var desktopMatch = !zenCoarsePointerMql.matches && window.innerWidth >= ZEN_DESKTOP_MIN_WIDTH;
    var next = mobileMatch || desktopMatch;
    var stateChanged = (next !== zenActive) || (desktopMatch !== zenDesktopActive);
    if (!stateChanged && !zenActive) return;

    var wasMobileZen = zenActive && !zenDesktopActive;
    zenActive = next;
    zenDesktopActive = desktopMatch;

    if (stateChanged) {
      readerScreen.classList.toggle('zen', zenActive);
      readerScreen.classList.toggle('desktop', zenDesktopActive);
      if (!zenActive) resetZenFramePadding();
      if (mobileMatch !== wasMobileZen) {
        readerScreen.classList.toggle('chrome-hidden', mobileMatch);
        if (mobileMatch) requestMobileFullscreen(); else exitMobileFullscreenIfNeeded();
      }
    }

    if (zenActive) recalcZenColumns();
    if (shown && idx >= 0) showPage(idx);
    updateZenImageForTime(audio.currentTime || 0);
    if (subtitleOverlay.classList.contains('show')) positionSubtitleOverlay();
  }

  if (zenMql.addEventListener) zenMql.addEventListener('change', applyZenState);
  else zenMql.addListener(applyZenState);
  window.addEventListener('resize', applyZenState);

  function updateChromeForPlaybackState(){
    if (!zenActive || zenDesktopActive) return;
    readerScreen.classList.toggle('chrome-hidden', !audio.paused);
    refreshZenLayout();
  }

  // Shared by the local forceZenBtn click AND a remote `toggleZen` command
  // (remote.html only shows that icon while THIS device - a normal
  // player, never a tv-player - is the active one) - same mechanism
  // either way, since a remote trigger isn't a genuine user gesture the
  // requestFullscreen() attempt inside may simply fail silently, same as
  // any other non-gesture-triggered call already does elsewhere.
  var zenForcedOn = false;
  function toggleForceZen(){
    zenForcedOn = !zenForcedOn;
    forceZenBtn.classList.toggle('active', zenForcedOn);
    if (!readerReady) return;
    if (zenForcedOn) {
      zenActive = true;
      zenDesktopActive = false;
      readerScreen.classList.add('zen');
      readerScreen.classList.remove('desktop');
      readerScreen.classList.add('chrome-hidden');
      recalcZenColumns();
      if (shown && idx >= 0) showPage(idx);
      updateZenImageForTime(audio.currentTime || 0);
      if (subtitleOverlay.classList.contains('show')) positionSubtitleOverlay();
      requestMobileFullscreen(); // most reliable when this IS a genuine user gesture (the local button click)
      if (audio.paused) audio.play();
    } else {
      zenActive = null;
      applyZenState();
    }
    reportState(true);
  }
  forceZenBtn.addEventListener('click', toggleForceZen);

  function applyDesktopFullscreenChrome(){
    if (zenCoarsePointerMql.matches) return;
    var fs = !!document.fullscreenElement;
    readerScreen.classList.toggle('chrome-hidden', fs);
    readerScreen.classList.toggle('fullscreen', fs);
    clearTimeout(desktopChromeHideTimer);
    fullscreenToggleBtn.classList.toggle('active', fs);
    refreshZenLayout();
  }
  document.addEventListener('fullscreenchange', applyDesktopFullscreenChrome);

  fullscreenToggleBtn.addEventListener('click', function(){
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(function(e){
        console.log('requestFullscreen failed: ' + e);
      });
    }
  });

  var desktopChromeHideTimer = null;
  var DESKTOP_CHROME_HOVER_ZONE = 0.8;
  var DESKTOP_CHROME_TOP_ZONE = 0.1;
  var DESKTOP_CHROME_HIDE_DELAY = 2500;

  document.addEventListener('mousemove', function(e){
    if (zenCoarsePointerMql.matches) return;
    if (!document.fullscreenElement) return;
    var inBottomZone = e.clientY >= window.innerHeight * DESKTOP_CHROME_HOVER_ZONE;
    var inTopZone = e.clientY <= window.innerHeight * DESKTOP_CHROME_TOP_ZONE;
    if (!inBottomZone && !inTopZone) return;
    readerScreen.classList.remove('chrome-hidden');
    refreshZenLayout();
    clearTimeout(desktopChromeHideTimer);
    desktopChromeHideTimer = setTimeout(function(){
      readerScreen.classList.add('chrome-hidden');
      refreshZenLayout();
    }, DESKTOP_CHROME_HIDE_DELAY);
  });

  function updateZenImageForTime(t){
    var url = null;
    if (zenImageList.length === 0) {
      url = (coverArt.style.display !== 'none' && coverArt.src) ? coverArt.src : null;
    } else if (zenImageList.length === 1) {
      url = zenImageList[0];
    } else {
      var frac = chapterDuration > 0 ? Math.min(0.999999, t / chapterDuration) : 0;
      var segment = Math.max(0, Math.min(zenImageList.length - 1, Math.floor(frac * zenImageList.length)));
      url = zenImageList[segment];
    }
    if (url && url !== zenCurrentImageUrl) {
      zenCurrentImageUrl = url;
      zenImage.src = url;
    }
    var shouldShow = zenActive && !!url;
    if (shouldShow !== (zenImageWrap.style.display === 'flex')) {
      zenImageWrap.style.display = shouldShow ? 'flex' : 'none';
      if (shown && idx >= 0) showPage(idx);
    }
  }

  var HIGHLIGHT_COLOR, FADE_BASE_COLOR;
  var PRELIT_COUNT = 2;
  var COMPLETE_AT_FRACTION = 0.95;

  // --- Translation subtitle overlay: an optional per-chapter .srt file
  // (chapter_NNN.srt alongside the audio - no reference to it in
  // book.json/sync.json, it's just present or it isn't), rendered as a
  // single-line caption in the gap between the reading area and the
  // progress bar. Runs on its own timeline (the .srt file's own cue
  // start/end times), entirely independent of the karaoke engine above
  // (sync.json's chunks) - but its "animated" mode deliberately reuses
  // that engine's exact fade-preset math (COMPLETE_AT_FRACTION) so the
  // two reveal styles feel like the same design language, per explicit
  // request.
  //
  // #subtitleToggleBtn ("C") cycles five global (localStorage, not
  // per-book - same pattern as textPreset/theme) modes on every click,
  // same as presetToggleBtn (see setTextPreset() above) - a plain click
  // toggle with NO active/highlighted visual state of its own, the
  // button glyph never changes:
  //   off -> animated -> static -> remote-animated -> remote-static -> off -> ...
  // "animated"/"static" show the overlay locally, exactly like before -
  // static just skips the per-word fade and shows the whole cue at once.
  // "remote-animated"/"remote-static" show nothing on THIS device at all -
  // cue text (and which of the two remote styles to use) is broadcast
  // over the existing WS state channel instead (see reportState() below)
  // for remote.html to render in the image-swap area, per its own "C"
  // toggle - same fade-vs-static distinction as the local modes, just
  // rendered on the other device.
  var SUBTITLE_MODES = ['off', 'animated', 'static', 'remote-animated', 'remote-static'];
  var subtitleMode = 'off';
  try {
    var storedSubtitleMode = localStorage.getItem('subtitleMode');
    if (SUBTITLE_MODES.indexOf(storedSubtitleMode) >= 0) subtitleMode = storedSubtitleMode;
  } catch(e){}
  function subtitlesShowOnPlayer(){ return subtitleMode === 'animated' || subtitleMode === 'static'; }
  function subtitlesShowOnRemote(){ return subtitleMode === 'remote-animated' || subtitleMode === 'remote-static'; }

  var subtitleCues = []; // [{start,end,text}], seconds
  var subtitleLoadToken = 0; // guards a slow-arriving fetch from a chapter already left
  var subtitleCueIndex = -1;
  var subtitleWordSpans = [];
  var currentSubtitleText = ''; // current cue's text regardless of mode - what the "remote-*" modes broadcast
  var currentSubtitleCueStart = 0, currentSubtitleCueEnd = 0; // sent alongside currentSubtitleText so remote.html can drive its own word-fade off the same cue timing
  var SUBTITLE_FONT_SIZE = 24; // flat size (px) - see showSubtitleCue()

  function parseSrtTime(s){
    var m = s.match(/(\d+):(\d\d):(\d\d)[,.](\d+)/);
    if (!m) return 0;
    return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000;
  }

  // A single .srt block's own text often bundles several sentences under
  // one timestamp pair (that's how the generator writes them, not a
  // per-sentence granularity) - splitting here means the overlay only
  // ever shows one sentence at a time, moving to the next only once the
  // current one's own (proportional) share of the block's timespan has
  // passed, per explicit request, rather than dumping the whole block on
  // screen at once (which is also most of what was overflowing the
  // reserved space in zen mode - see SUBTITLE_RESERVED_H). Split point is
  // "a period" (each match greedily eats a run of non-period characters
  // plus the period(s) that end it, so "..." stays one piece) -
  // deliberately simple as asked, so this will over-split on
  // abbreviations like "Mr. Smith", a known tradeoff of naive
  // period-splitting rather than a real sentence tokenizer. Written as an
  // exec() loop rather than String.split() with a lookbehind
  // (`/(?<=\.)\s+/`) specifically for iOS Safari - lookbehind assertions
  // only landed in Safari 16.4 (2023), and this overlay's whole reason to
  // exist right now is iPad zen mode.
  function splitIntoSentences(text){
    var sentences = [];
    var re = /[^.]*\.+/g;
    var m, lastIndex = 0;
    while ((m = re.exec(text))) {
      var s = m[0].trim();
      if (s) sentences.push(s);
      lastIndex = re.lastIndex;
    }
    var rest = text.slice(lastIndex).trim();
    if (rest) sentences.push(rest);
    return sentences.length ? sentences : [text];
  }

  // Each sentence's slice of the block's [start,end) window is
  // proportional to its own character length (a longer sentence gets
  // more display time), with the last sentence absorbing any rounding
  // remainder so the sum always lands exactly on the block's real end.
  function splitCueBySentence(cue){
    var sentences = splitIntoSentences(cue.text);
    if (sentences.length <= 1) return [cue];
    var totalLen = sentences.reduce(function(sum, s){ return sum + s.length; }, 0);
    var span = cue.end - cue.start;
    var subCues = [];
    var t = cue.start;
    sentences.forEach(function(s, i){
      var isLast = i === sentences.length - 1;
      var dur = isLast ? (cue.end - t) : span * (totalLen > 0 ? s.length / totalLen : 1 / sentences.length);
      subCues.push({ start: t, end: t + dur, text: s });
      t += dur;
    });
    return subCues;
  }

  // Minimal SRT parser: index line, "start --> end" (HH:MM:SS,mmm), one
  // or more text lines, blank-line separated. Multi-line cues are joined
  // with a space, then run through splitCueBySentence() above - the
  // overlay wraps to as many lines as it needs for whichever sentence is
  // current.
  function parseSrt(text){
    var cues = [];
    var blocks = text.replace(/\r/g, '').split(/\n\n+/);
    for (var i = 0; i < blocks.length; i++) {
      var lines = blocks[i].split('\n').filter(function(l){ return l.trim() !== ''; });
      if (lines.length < 2) continue;
      var timeLineIdx = lines[0].indexOf('-->') >= 0 ? 0 : 1;
      var timeLine = lines[timeLineIdx];
      if (timeLine.indexOf('-->') < 0) continue;
      var parts = timeLine.split('-->');
      var cueText = lines.slice(timeLineIdx + 1).join(' ').trim();
      if (!cueText) continue;
      var block = { start: parseSrtTime(parts[0]), end: parseSrtTime(parts[1]), text: cueText };
      cues = cues.concat(splitCueBySentence(block));
    }
    return cues;
  }

  // Fire-and-forget (not part of the main Promise.all in openChapter) -
  // most chapters won't have a .srt at all, so this shouldn't slow down
  // the critical path of getting audio/text on screen. Toggling
  // subtitles on before this resolves just shows nothing until it does.
  async function loadSubtitleForChapter(id, base){
    var myToken = ++subtitleLoadToken;
    subtitleCues = [];
    subtitleCueIndex = -1;
    currentSubtitleText = '';
    hideSubtitleOverlay();
    try {
      var res = await fetch('/api/books/' + id + '/chapters/' + base + '/subtitle');
      if (!res.ok || myToken !== subtitleLoadToken) return;
      var text = await res.text();
      if (myToken !== subtitleLoadToken) return;
      subtitleCues = parseSrt(text);
    } catch (e) {}
  }

  function hideSubtitleOverlay(){
    subtitleOverlay.classList.remove('show');
    subtitleText.innerHTML = '';
    subtitleWordSpans = [];
  }

  // #subtitleOverlay is position:fixed (see the HTML comment on it for
  // why it can't just be a normal flex child of #readerScreen) - this is
  // what actually anchors it to the real gap below #frame, whose own
  // bottom padding is independently bumped by SUBTITLE_RESERVED_H
  // (recalcZenColumns()/getAvailableSpace()) whenever subtitles are on,
  // so the reading text/zen image never render underneath it.
  function positionSubtitleOverlay(){
    subtitleOverlay.style.top = frame.getBoundingClientRect().bottom + 'px';
  }

  // #frame's viewport position shifts on any resize (even in non-zen
  // mode, where its padding is a fixed px value, not viewport-relative)
  // - reposition a currently-visible cue rather than leaving it stranded
  // wherever #frame used to end.
  window.addEventListener('resize', function(){
    if (subtitleOverlay.classList.contains('show')) positionSubtitleOverlay();
  });

  function showSubtitleCue(cue){
    // Flat size instead of a dynamic fit - that was swinging too small/
    // too large cue to cue. #subtitleOverlay wraps (white-space:normal)
    // within its own 5%-each-side padding rather than needing to fit a
    // single line, so a flat size never needs to overflow the screen.
    subtitleText.style.fontSize = SUBTITLE_FONT_SIZE + 'px';
    subtitleText.innerHTML = '';
    var words = cue.text.split(/\s+/).filter(Boolean);
    subtitleWordSpans = [];
    words.forEach(function(w, i){
      var span = document.createElement('span');
      span.textContent = w;
      subtitleText.appendChild(span);
      subtitleWordSpans.push(span);
      if (i < words.length - 1) subtitleText.appendChild(document.createTextNode(' '));
    });
    // "static" mode: show the whole cue at once, no per-word fade -
    // updateSubtitleWordFade() (which drives the per-word opacity ramp)
    // is only ever called for "animated" mode, so without this the words
    // would just sit at their CSS default opacity:0 forever.
    if (subtitleMode === 'static') {
      subtitleWordSpans.forEach(function(span){ span.style.opacity = '1'; });
    }
    positionSubtitleOverlay();
    subtitleOverlay.classList.add('show');
  }

  // Exact same fade-preset formula as updateChunkHighlight()'s preset-B
  // branch (continuous opacity ramp over COMPLETE_AT_FRACTION of the
  // cue's own duration), just applied per-word instead of per-character
  // and with no "pre-lit" head start (a whole word appearing has more
  // visual weight than a single character, so there's less need to
  // soften the very start the way the character version does).
  function updateSubtitleWordFade(t, cue){
    if (!subtitleWordSpans.length) return;
    var span = cue.end - cue.start;
    var frac = span > 0 ? (t - cue.start) / span : 1;
    frac = Math.max(0, Math.min(1, frac));
    var adjustedFrac = Math.min(1, frac / COMPLETE_AT_FRACTION);
    var n = subtitleWordSpans.length;
    var continuous = adjustedFrac * n;
    for (var i = 0; i < n; i++) {
      subtitleWordSpans[i].style.opacity = Math.max(0, Math.min(1, continuous - i));
    }
  }

  function findSubtitleCueIndex(t){
    for (var i = 0; i < subtitleCues.length; i++) {
      if (t >= subtitleCues[i].start && t < subtitleCues[i].end) return i;
    }
    return -1;
  }

  // Returns true iff the current cue changed (index-wise) this call -
  // the timeupdate handler uses that to force an immediate WS state push
  // (see reportState()) rather than waiting for its normal ~1/sec
  // throttle, so a remote-mode caption changes lines promptly.
  function updateSubtitleForTime(t){
    if (subtitleMode === 'off' || !subtitleCues.length) {
      if (subtitleCueIndex === -1) return false;
      subtitleCueIndex = -1;
      currentSubtitleText = '';
      currentSubtitleCueStart = currentSubtitleCueEnd = 0;
      hideSubtitleOverlay();
      return true;
    }
    var newIndex = findSubtitleCueIndex(t);
    var changed = newIndex !== subtitleCueIndex;
    if (changed) {
      subtitleCueIndex = newIndex;
      var cue = newIndex >= 0 ? subtitleCues[newIndex] : null;
      currentSubtitleText = cue ? cue.text : '';
      currentSubtitleCueStart = cue ? cue.start : 0;
      currentSubtitleCueEnd = cue ? cue.end : 0;
      // Only "animated"/"static" touch the local overlay's DOM at all -
      // the two "remote-*" modes deliberately show nothing on this
      // device, just update currentSubtitleText above for reportState()
      // to send on.
      if (subtitlesShowOnPlayer()) {
        if (cue) showSubtitleCue(cue); else hideSubtitleOverlay();
      }
    }
    if (subtitleMode === 'animated' && newIndex >= 0) updateSubtitleWordFade(t, subtitleCues[newIndex]);
    return changed;
  }

  // Shared by the local "C" button AND a remote `toggleSubtitle` command
  // (remote.html's own new "C" button - same mechanism as toggleForceZen()
  // above) - advances the shared five-mode cycle one step either way.
  function advanceSubtitleMode(){
    var i = SUBTITLE_MODES.indexOf(subtitleMode);
    subtitleMode = SUBTITLE_MODES[(i + 1) % SUBTITLE_MODES.length];
    try { localStorage.setItem('subtitleMode', subtitleMode); } catch(e){}

    // Mode change affects how much bottom space #frame reserves on THIS
    // device (only animated/static reserve any - the two remote-* modes
    // and off don't) - re-derive it (zen's own column math, or the plain
    // non-zen padding) and re-fit the currently shown page against the
    // new space immediately, rather than waiting for the next
    // resize/page turn.
    if (zenActive) recalcZenColumns(); else applyNonZenSubtitlePadding();
    if (shown && idx >= 0) showPage(idx);

    hideSubtitleOverlay();
    subtitleCueIndex = -1; // force a fresh evaluation against the current time
    updateSubtitleForTime(audio.currentTime || 0);
    reportState(true); // push the new mode/cue to remote.html immediately
  }
  subtitleToggleBtn.addEventListener('click', advanceSubtitleMode);

  var textPreset = 'A';
  try { textPreset = localStorage.getItem('textPreset') || 'A'; } catch(e){}

  function applyInitialSpanState(){
    var i;
    if (textPreset === 'B') {
      for (i = 0; i < chunkSpans.length; i++) {
        chunkSpans[i].style.color = FADE_BASE_COLOR;
        chunkSpans[i].style.opacity = (i < PRELIT_COUNT) ? '1' : '0';
      }
    } else {
      for (i = 0; i < chunkSpans.length; i++) {
        chunkSpans[i].style.opacity = '';
        chunkSpans[i].style.color = (i < chunkLitCount) ? HIGHLIGHT_COLOR : '';
      }
    }
  }

  function updateChunkHighlight(t, chunk){
    if (!shown || chunkSpans.length === 0) return;
    var span = chunk.end - chunk.start;
    var frac = span > 0 ? (t - chunk.start) / span : 1;
    frac = Math.max(0, Math.min(1, frac));
    var adjustedFrac = Math.min(1, frac / COMPLETE_AT_FRACTION);
    var remaining = Math.max(0, chunkSpans.length - PRELIT_COUNT);

    if (textPreset === 'B') {
      var continuous = adjustedFrac * remaining;
      for (var i = 0; i < remaining; i++) {
        chunkSpans[PRELIT_COUNT + i].style.opacity = Math.max(0, Math.min(1, continuous - i));
      }
      return;
    }

    var litCount = Math.min(chunkSpans.length, PRELIT_COUNT + Math.floor(adjustedFrac * remaining));
    if (litCount === chunkLitCount) return;
    var j;
    if (litCount > chunkLitCount) {
      for (j = chunkLitCount; j < litCount; j++) chunkSpans[j].style.color = HIGHLIGHT_COLOR;
    } else {
      for (j = litCount; j < chunkLitCount; j++) chunkSpans[j].style.color = '';
    }
    chunkLitCount = litCount;
  }

  function setTextPreset(preset){
    if (preset !== 'A' && preset !== 'B') return;
    textPreset = preset;
    try { localStorage.setItem('textPreset', preset); } catch(e){}
    if (shown && chunkSpans.length) {
      applyInitialSpanState();
      updateChunkHighlight(audio.currentTime || 0, chunks[idx]);
    }
    reportState(true);
  }

  presetToggleBtn.addEventListener('click', function(){
    setTextPreset(textPreset === 'A' ? 'B' : 'A');
  });

  function updateThemeColors(){
    var cs = getComputedStyle(document.documentElement);
    HIGHLIGHT_COLOR = cs.getPropertyValue('--read-text-highlight-a').trim();
    FADE_BASE_COLOR = cs.getPropertyValue('--read-text-b').trim();
  }

  var theme = 'dark';
  try { theme = localStorage.getItem('theme') || 'dark'; } catch(e){}

  function applyTheme(){
    document.documentElement.classList.toggle('light', theme === 'light');
    updateThemeColors();
    if (shown && chunkSpans.length) {
      applyInitialSpanState();
      updateChunkHighlight(audio.currentTime || 0, chunks[idx]);
    }
    reportState(true);
  }

  applyTheme();
  themeToggleBtn.addEventListener('click', function(){
    theme = theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', theme); } catch(e){}
    applyTheme();
  });

  function currentChunkIndex(t){
    var i = 0;
    for(var k = 0; k < chunks.length; k++){
      if(chunks[k].start <= t) i = k; else break;
    }
    return i;
  }

  function renderTimeUI(t){
    elapsedLabel.textContent = formatTime(t);
    var pct = chapterDuration > 0 ? Math.max(0, Math.min(100, (t / chapterDuration) * 100)) : 0;
    progressFill.style.width = pct + '%';
    progressMarker.style.left = pct + '%';
  }

  function updateForTime(t){
    if (scrubbing) return;
    renderTimeUI(t);

    if(chunks.length === 0) return;
    var newIdx = currentChunkIndex(t);
    var chunk = chunks[newIdx];
    var active = t >= chunk.start && t < chunk.end;

    if(newIdx !== idx || active !== shown){
      idx = newIdx;
      shown = active;
      if(shown){
        showPage(idx);
      } else {
        blankPage();
      }
      updateChapterPill();
    }

    updateChunkHighlight(t, chunk);
    updateZenImageForTime(t);
  }

  function updatePlayPauseIcon(){
    playIcon.style.display = audio.paused ? '' : 'none';
    pauseIcon.style.display = audio.paused ? 'none' : '';
    playPauseBtn.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
  }

  var wakeLock = null;
  async function acquireWakeLock(){
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
    } catch (e) {
      console.log('wakeLock request failed: ' + e);
    }
  }
  function releaseWakeLock(){
    if (!wakeLock) return;
    wakeLock.release().catch(function(){});
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !audio.paused) acquireWakeLock();
  });

  audio.addEventListener('play', function(){ reportState(true); updateChromeForPlaybackState(); updatePlayPauseIcon(); acquireWakeLock(); });
  audio.addEventListener('pause', function(){ reportState(true); updateChromeForPlaybackState(); updatePlayPauseIcon(); releaseWakeLock(); });

  audio.addEventListener('timeupdate', function(){
    var t = audio.currentTime;
    if (isNaN(t)) return;
    updateForTime(t);
    var subtitleCueChanged = updateSubtitleForTime(t);
    reportState(subtitleCueChanged);
  });

  audio.addEventListener('ended', function(){
    var currentIndex = allChapters.indexOf(chapterBase);
    if (currentIndex >= 0 && currentIndex + 1 < allChapters.length) {
      // Reset the just-finished chapter's saved position back to 0 -
      // otherwise it's left parked right at (or past) its own duration,
      // and reopening that chapter later would resume there and
      // immediately re-fire 'ended' on its own, auto-advancing again
      // before the user ever hears anything - an endless-loop trap
      // instead of actually replaying the chapter from the start.
      putLastPosition(bookId, chapterBase, 0);
      openChapter(bookId, allChapters[currentIndex + 1]);
    }
  });

  function togglePlayPause(){
    if(audio.paused) audio.play(); else audio.pause();
  }

  var SEEK_EPSILON = 0.05;

  function seekToTime(targetTime){
    if (chapterDuration > 0) targetTime = Math.max(0, Math.min(targetTime, chapterDuration));
    else targetTime = Math.max(0, targetTime);
    var wasPlaying = !audio.paused;
    audio.currentTime = targetTime;
    if (wasPlaying) audio.play();
    updateForTime(targetTime);
    reportState(true);
  }

  function seekToChunk(target){
    target = Math.max(0, Math.min(chunks.length - 1, target));
    seekToTime(chunks[target].start + SEEK_EPSILON);
  }

  function goNext(){ if (chunks.length) seekToChunk(idx + 1); }
  function goPrev(){ if (chunks.length) seekToChunk(Math.max(0, idx - 1)); }

  var PREV_CHAPTER_DOUBLE_MS = 1500;
  var lastPrevChapterClick = 0;
  prevChapterBtn.addEventListener('click', function(){
    var now = Date.now();
    if (now - lastPrevChapterClick < PREV_CHAPTER_DOUBLE_MS) {
      lastPrevChapterClick = 0;
      goPrevChapter();
    } else {
      lastPrevChapterClick = now;
      seekToTime(0);
    }
  });
  prevPartBtn.addEventListener('click', goPrev);
  playPauseBtn.addEventListener('click', togglePlayPause);
  nextPartBtn.addEventListener('click', goNext);
  nextChapterBtn.addEventListener('click', goNextChapter);

  // --- Gestures: single tap reveals chrome, double-tap play/pause,
  // triple-tap back to chapter.html, edge-swipe prev/next part, swipe up
  // to bookmark. See _legacy-index.html for the full design rationale.
  var EDGE_ZONE = 32;
  var SWIPE_MIN_DX = 48;
  var TAP_MAX_MOVE = 12;
  var TAP_GAP_MS = 300;
  var VSWIPE_MIN_DY = 64;

  var pointerStart = null;
  var tapCount = 0;
  var tapTimer = null;

  function registerTap(){
    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){
      if (tapCount === 1) {
        toggleChromeFromTap();
      } else if (tapCount === 2) {
        togglePlayPause();
      } else if (tapCount >= 3) {
        goToLibrary();
      }
      tapCount = 0;
    }, TAP_GAP_MS);
  }

  function toggleChromeFromTap(){
    if (zenCoarsePointerMql.matches) {
      if (!zenActive) return;
      readerScreen.classList.toggle('chrome-hidden');
      refreshZenLayout();
    } else {
      if (!document.fullscreenElement) return;
      readerScreen.classList.toggle('chrome-hidden');
      refreshZenLayout();
      clearTimeout(desktopChromeHideTimer);
      if (readerScreen.classList.contains('chrome-hidden')) return;
      desktopChromeHideTimer = setTimeout(function(){
        readerScreen.classList.add('chrome-hidden');
        refreshZenLayout();
      }, DESKTOP_CHROME_HIDE_DELAY);
    }
  }

  frame.addEventListener('pointerdown', function(e){
    pointerStart = { x: e.clientX, y: e.clientY };
  });

  frame.addEventListener('pointerup', function(e){
    if (!pointerStart) return;
    var dx = e.clientX - pointerStart.x;
    var dy = e.clientY - pointerStart.y;
    var rect = frame.getBoundingClientRect();
    var startedNearLeft = (pointerStart.x - rect.left) <= EDGE_ZONE;
    var startedNearRight = (rect.right - pointerStart.x) <= EDGE_ZONE;
    var horizontal = Math.abs(dx) > Math.abs(dy);
    pointerStart = null;

    if (horizontal && dx >= SWIPE_MIN_DX && startedNearLeft) {
      goNext();
    } else if (horizontal && -dx >= SWIPE_MIN_DX && startedNearRight) {
      goPrev();
    } else if (!horizontal && -dy >= VSWIPE_MIN_DY) {
      saveBookmarkGesture();
    } else if (Math.abs(dx) < TAP_MAX_MOVE && Math.abs(dy) < TAP_MAX_MOVE) {
      registerTap();
    }
  });

  async function saveBookmarkGesture(){
    if (!bookId || !chapterBase) return;
    var t = audio.currentTime || 0;
    try {
      var res = await fetch('/api/books/' + bookId + '/bookmarks', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chapterBase: chapterBase, positionSeconds: t })
      });
      if (!res.ok) return;
      var json = await res.json();
      if (json && json.label) showBookmarkToast(json.label);
    } catch (e) {}
  }

  var bookmarkToastTimer = null;
  function showBookmarkToast(text){
    bookmarkToast.textContent = text;
    bookmarkToast.classList.add('show');
    if (bookmarkToastTimer) clearTimeout(bookmarkToastTimer);
    bookmarkToastTimer = setTimeout(function(){ bookmarkToast.classList.remove('show'); }, 1600);
  }
  bookmarkBtn.addEventListener('click', saveBookmarkGesture);

  function scrubTargetFromEvent(e){
    var rect = progressTrack.getBoundingClientRect();
    var frac = (e.clientX - rect.left) / rect.width;
    frac = Math.max(0, Math.min(1, frac));
    return frac * (chapterDuration || 0);
  }

  progressTrack.addEventListener('pointerdown', function(e){
    scrubbing = true;
    try { progressTrack.setPointerCapture(e.pointerId); } catch(err){}
    renderTimeUI(scrubTargetFromEvent(e));
  });
  progressTrack.addEventListener('pointermove', function(e){
    if (scrubbing) renderTimeUI(scrubTargetFromEvent(e));
  });
  progressTrack.addEventListener('pointerup', function(e){
    if (!scrubbing) return;
    scrubbing = false;
    seekToTime(scrubTargetFromEvent(e));
  });

  function setSpeed(v){
    if (!isFinite(v)) return;
    v = Math.max(0.25, Math.min(8, Math.round(v * 100) / 100));
    currentSpeed = v;
    audio.playbackRate = v;
    speedLabel.textContent = v.toFixed(2) + 'x';
    speedValue.textContent = v.toFixed(2) + 'x';
    speedSlider.value = v;
    reportState(true);
  }

  speedPill.addEventListener('click', function(){
    speedOverlay.style.display = (speedOverlay.style.display === 'flex') ? 'none' : 'flex';
  });
  speedOverlay.addEventListener('click', function(e){
    if (e.target === speedOverlay) speedOverlay.style.display = 'none';
  });
  speedDown.addEventListener('click', function(){ setSpeed(currentSpeed - 0.01); });
  speedUp.addEventListener('click', function(){ setSpeed(currentSpeed + 0.01); });
  speedSlider.addEventListener('input', function(){ setSpeed(parseFloat(speedSlider.value)); });
  Array.prototype.forEach.call(document.querySelectorAll('#speedPresets button'), function(btn){
    btn.addEventListener('click', function(){ setSpeed(parseFloat(btn.getAttribute('data-speed'))); });
  });

  var VOLUME_STEP = 5;
  var volumeLevel = Math.round((audio.volume || 1) * 100 / VOLUME_STEP) * VOLUME_STEP;
  var muted = false;
  var volumeBeforeMute = volumeLevel;

  function renderVolumeLevel(){
    volumeLevelPill.textContent = volumeLevel;
    audio.volume = volumeLevel / 100;
  }
  renderVolumeLevel();

  function setVolumeLevel(v){
    volumeLevel = Math.max(0, Math.min(100, v));
    renderVolumeLevel();
  }

  function setMuted(v){
    muted = v;
    volumeIconNormal.style.display = muted ? 'none' : '';
    volumeIconMuted.style.display = muted ? '' : 'none';
  }

  volumeToggleBtn.addEventListener('click', function(e){
    e.stopPropagation();
    volumePopup.classList.toggle('show');
  });

  var VOLUME_REPEAT_DELAY = 400;
  var VOLUME_REPEAT_INTERVAL = 120;
  var volumeRepeatTimer = null;

  function startVolumeRepeat(step){
    if (step > 0 && muted) setMuted(false);
    setVolumeLevel(volumeLevel + step);
    volumeRepeatTimer = setTimeout(function repeat(){
      setVolumeLevel(volumeLevel + step);
      volumeRepeatTimer = setTimeout(repeat, VOLUME_REPEAT_INTERVAL);
    }, VOLUME_REPEAT_DELAY);
  }
  function stopVolumeRepeat(){
    clearTimeout(volumeRepeatTimer);
    volumeRepeatTimer = null;
  }
  volumeUpBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startVolumeRepeat(VOLUME_STEP); });
  volumeDownBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startVolumeRepeat(-VOLUME_STEP); });
  window.addEventListener('pointerup', stopVolumeRepeat);
  window.addEventListener('pointercancel', stopVolumeRepeat);

  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (muted) {
      setMuted(false);
      setVolumeLevel(volumeBeforeMute);
    } else {
      volumeBeforeMute = volumeLevel;
      setMuted(true);
      setVolumeLevel(0);
    }
    volumePopup.classList.remove('show');
  });

  function setupMarquee(el, text){
    el.classList.remove('scrolling');
    el.innerHTML = '';
    if (!text) return;

    var inner = document.createElement('span');
    inner.className = 'marqueeInner';
    var first = document.createElement('span');
    first.textContent = text;
    inner.appendChild(first);
    var gap = document.createElement('span');
    gap.className = 'marqueeGap';
    inner.appendChild(gap);
    var second = document.createElement('span');
    second.textContent = text;
    inner.appendChild(second);
    el.appendChild(inner);

    requestAnimationFrame(function(){
      if (inner.scrollWidth > el.clientWidth * 1.9) {
        var singleWidth = inner.scrollWidth / 2;
        var duration = Math.max(6, singleWidth / 40);
        inner.style.animationDuration = duration + 's';
        el.classList.add('scrolling');
      } else {
        second.remove();
        gap.remove();
      }
    });
  }

  function applyMetadata(meta, id, base){
    var title = (meta.title || '').trim();
    var author = (meta.artist || '').trim();
    var album = (meta.album || '').trim();
    if (author) {
      chapterTitleEl.textContent = author;
    } else if (title) {
      chapterTitleEl.textContent = title;
    }
    setupMarquee(authorTitleEl, album);

    if (meta.hasCover) {
      coverArt.src = '/api/books/' + id + '/chapters/' + base + '/cover';
      coverArt.style.display = 'block';
      coverPlaceholder.style.display = 'none';
    } else {
      coverArt.style.display = 'none';
      coverPlaceholder.style.display = 'flex';
    }
  }

  // --- Loading: direct REST, mirroring tv-player.html's pattern exactly -
  // no "prepare"/cache-copy step exists here (unlike the Android app),
  // since a real Range-serving file server needs none of that.
  async function ensureChapterList(id){
    if (bookId === id && allChapters.length) return;
    var data = await fetchJson('/api/books/' + id + '/chapters', { chapters: [] });
    bookId = id;
    allChapters = data.chapters || [];
  }

  async function openChapter(id, base, resumeSeconds){
    var myToken = ++loadToken;
    await ensureChapterList(id);
    if (myToken !== loadToken) return;

    chapterBase = base;
    idx = -1;
    shown = false;
    audio.pause();
    chunks = [];
    chapterDuration = 0;
    elapsedLabel.textContent = '0:00';
    totalLabel.textContent = '0:00';
    renderTimeUI(0);

    chapterTitleEl.textContent = humanize(base);
    authorTitleEl.innerHTML = '';
    coverArt.style.display = 'none';
    coverPlaceholder.style.display = 'flex';
    updateChapterPill();

    readerReady = true;
    readerScreen.style.display = 'flex';
    pageText.style.display = 'none';
    loadingOverlay.style.display = 'block';

    loadSubtitleForChapter(id, base); // fire-and-forget - see the function's own comment

    // If the caller didn't already know a resume time (goNextChapter/
    // goPrevChapter/the 'ended' auto-advance handler all just open the
    // neighboring chapter with no third argument), look up that specific
    // chapter's own saved position instead of always restarting at 0 -
    // every chapter remembers its own progress server-side. A caller that
    // DOES pass an explicit number (the initial URL load, or a remote
    // `load` command) is trusted as-is, including an explicit 0.
    var needsProgressLookup = (resumeSeconds === undefined);

    var syncPromise = fetchJson('/api/books/' + id + '/chapters/' + base + '/sync', { chunks: [] });
    var metaPromise = fetchJson('/api/books/' + id + '/chapters/' + base + '/metadata', {});
    var imagesPromise = fetchJson('/api/books/' + id + '/chapters/' + base + '/images', { images: [] });
    var progressPromise = needsProgressLookup
      ? fetchJson('/api/books/' + id + '/chapters/' + base + '/progress', { positionSeconds: 0 })
      : Promise.resolve(null);
    var results = await Promise.all([syncPromise, metaPromise, imagesPromise, progressPromise]);
    if (myToken !== loadToken) return;
    if (needsProgressLookup) resumeSeconds = (results[3] && results[3].positionSeconds) || 0;

    chunks = results[0].chunks || [];
    chapterDuration = chunks.length ? chunks[chunks.length - 1].end : 0;
    totalLabel.textContent = formatTime(chapterDuration);
    updateChapterPill();

    var meta = results[1] || {};
    applyMetadata(meta, id, base);

    zenImageList = [];
    zenCurrentImageUrl = null;
    (results[2].images || []).forEach(function(name){
      zenImageList.push('/api/books/' + id + '/images/' + name);
    });
    if (zenImageList.length === 0 && meta.hasCover) {
      zenImageList.push('/api/books/' + id + '/chapters/' + base + '/cover');
    }

    loadingOverlay.style.display = 'none';
    pageText.style.display = 'flex';

    applyZenState();
    applyNonZenSubtitlePadding(); // applyZenState() is a no-op when staying non-zen, so this covers that case explicitly

    audio.src = '/api/books/' + id + '/chapters/' + base + '/audio';
    audio.playbackRate = currentSpeed;
    if (resumeSeconds) {
      seekToTime(resumeSeconds);
      audio.play().catch(function(e){ console.log('resume autoplay failed: ' + e); });
    } else {
      updateForTime(0);
      audio.play().catch(function(e){ console.log('autoplay failed: ' + e); });
    }
    reportState(true);
  }

  // --- Sync: registers as role:'player' on connect, which is itself what
  // claims active-device status (see server/src/sync.js's claimActive()) -
  // no separate self-load round-trip needed, unlike the old single-active-
  // device design. A `killed` command (this device displaced by a newer
  // normal player or tv-player) shows a plain "Session Ended" screen with
  // no auto-recovery, per the rebuild spec.
  var playerDeviceId;
  try {
    playerDeviceId = localStorage.getItem('playerDeviceId');
    if (!playerDeviceId) { playerDeviceId = crypto.randomUUID(); localStorage.setItem('playerDeviceId', playerDeviceId); }
  } catch (e) { playerDeviceId = 'player-' + Math.random().toString(36).slice(2); }

  var playerDeviceKind = matchMedia('(pointer: coarse)').matches
    ? (window.innerWidth < 768 ? 'phone' : 'tablet') : 'desktop';
  var playerDeviceName = params.get('name') ||
    ('Player (' + playerDeviceKind.charAt(0).toUpperCase() + playerDeviceKind.slice(1) + ')');

  var ws = null;
  function wsSend(payload){
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
  }

  // Takes explicit id/base params (rather than always reading the current
  // globals) so a just-finished chapter's position can be reset even
  // after chapterBase has already moved on to the next chapter - see the
  // 'ended' handler below.
  function putLastPosition(id, base, t){
    if (!id || !base) return;
    fetch('/api/books/' + id + '/last-position', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chapterBase: base, positionSeconds: t })
    }).catch(function(){});
  }
  function persistLastPosition(t){
    putLastPosition(bookId, chapterBase, t);
  }

  var lastReportedSecond = -1;
  function reportState(force){
    var t = audio.currentTime || 0;
    var sec = Math.floor(t);
    if (!force && sec === lastReportedSecond) return;
    lastReportedSecond = sec;
    persistLastPosition(t);
    wsSend({
      type: 'state',
      bookId: bookId, chapterBase: chapterBase,
      position: t, duration: chapterDuration,
      paused: audio.paused,
      preset: textPreset, theme: theme, zenActive: !!zenActive, speed: currentSpeed,
      chapterIndex: chapterNumber(chapterBase) || 0, totalChapters: chapterTotalCount(),
      partIndex: idx + 1, totalParts: chunks.length,
      // remote.html only actually acts on these while subtitleMode is
      // 'remote-animated'/'remote-static' (see its own "C" toggle) - sent
      // unconditionally here since it's cheap and keeps the two sides in
      // sync regardless of which one changes mode first. Cue start/end
      // let remote.html drive its own word-by-word fade (remote-animated
      // only - remote-static just shows the whole cue like player.html's
      // own "static" mode) off the same timing as player.html's own
      // "animated" mode (see updateSubtitleWordFade()).
      subtitleMode: subtitleMode, subtitleText: currentSubtitleText,
      subtitleCueStart: currentSubtitleCueStart, subtitleCueEnd: currentSubtitleCueEnd
    });
  }

  function showSessionEndedScreen(){
    killed = true;
    loadToken++;
    audio.pause();
    try { audio.removeAttribute('src'); audio.load(); } catch (e) {}
    readerScreen.style.display = 'none';
    sessionEndedScreen.style.display = 'flex';
  }

  function handleSyncCommand(msg){
    if (killed) return; // no recovery once killed, per spec
    switch (msg.action) {
      case 'load': openChapter(msg.bookId, msg.chapterBase, msg.positionSeconds || 0); break;
      case 'killed': showSessionEndedScreen(); break;
      case 'playPause': togglePlayPause(); break;
      case 'seek': seekToTime(msg.value || 0); break;
      case 'next': goNext(); break;
      case 'prev': goPrev(); break;
      case 'nextChapter': goNextChapter(); break;
      case 'prevChapter': goPrevChapter(); break;
      case 'setPreset': setTextPreset(msg.value); break;
      case 'setTheme':
        if ((msg.value === 'light' || msg.value === 'dark') && msg.value !== theme) themeToggleBtn.click();
        break;
      case 'setVolume': setVolumeLevel(Math.round((msg.value || 0) * 100)); break;
      case 'toggleZen': toggleForceZen(); break;
      case 'toggleSubtitle': advanceSubtitleMode(); break;
      case 'setSpeed': setSpeed(msg.value); break;
    }
  }

  function connectSync(){
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    ws.addEventListener('open', function(){
      wsSend({ type: 'hello', role: 'player', deviceId: playerDeviceId, deviceName: playerDeviceName, deviceKind: playerDeviceKind });
    });
    ws.addEventListener('message', function(ev){
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'command') handleSyncCommand(msg);
    });
    ws.addEventListener('close', function(){ if (!killed) setTimeout(connectSync, 2000); });
    ws.addEventListener('error', function(){ try { ws.close(); } catch (e) {} });
  }

  if (urlBookId && urlChapterBase) {
    openChapter(urlBookId, urlChapterBase, urlResumeSeconds);
  } else {
    alert('Missing book/chapter - returning to the library.');
    location.href = 'library.html?mode=player';
  }
  connectSync();
})();
</script>
</body>
</html>
